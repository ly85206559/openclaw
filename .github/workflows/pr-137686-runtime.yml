name: PR 137686 real account-label runtime proof
on:
  push:
    branches: [codex/proof-137686-runtime-20260905]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@12.1.0
      - run: pnpm install --frozen-lockfile
      - name: Run real SQLite and chat label production owners
        shell: bash
        run: |
          set -o pipefail
          node --import ./scripts/tsx.mjs .github/proof/pr-137686-runtime.mts | tee account-label-runtime-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-137686-runtime-proof
          path: account-label-runtime-proof.log
          if-no-files-found: warn
