name: PR 151009 single-cell lease observation
on:
  push:
    branches: [codex/proof-pr151009-observe-20261023]
permissions:
  contents: read
jobs:
  observation:
    if: github.repository == 'ly85206559/openclaw' && github.event_name == 'push' && github.ref == 'refs/heads/codex/proof-pr151009-observe-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      SOURCE_SHA: 4be713527fbc5f6eb815294cd525f934404516a0
      SOURCE_TREE: 1ffa3020f48d9b0441319b3890bcade0276f96d7
      CELL: tested-merge
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
      OPENCLAW_VITEST_WORKER_CACHE: "1"
      OPENCLAW_VITEST_FS_MODULE_CACHE_WRITER: "0"
      OPENCLAW_NODE_COMPILE_CACHE_WRITER: "0"
      NODE_COMPILE_CACHE_PORTABLE: "1"
      OPENCLAW_CI_TEST_RUNTIME_POLICY: bun-compatible
      FROZEN_TARGET: "false"
      OPENCLAW_NODE_TEST_PLAN_CONCURRENCY: "1"
      OPENCLAW_NODE_TEST_PLAN_CONTINUE_ON_FAILURE: "1"
      OPENCLAW_NODE_TEST_VITEST_ARGS_JSON: "[]"
      OPENCLAW_VITEST_SHARD_NAME: changed-compact-large-43
      OPENCLAW_VITEST_NO_OUTPUT_TIMEOUT_MS: "300000"
      OPENCLAW_NODE_TEST_GROUPS_GZIP_BASE64: 
    steps:
      - name: Get immutable reviewed proof instructions without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: instructions
          persist-credentials: false
      - name: Get the original immutable tested merge without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: openclaw/openclaw
          ref: 4be713527fbc5f6eb815294cd525f934404516a0
          path: source
          persist-credentials: false
      - name: Install original pinned Node and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.5.1
      - name: Install frozen original-source dependencies in this secretless runner
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 12.5.1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          pnpm install --frozen-lockfile
          git diff --exit-code
          git diff --cached --exit-code
      - name: Check every original blob and apply the reviewed observation overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C instructions rev-parse HEAD)" = "$GITHUB_SHA"
          node instructions/.github/proof/pr-151009-observation/controller.mjs apply "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/lease-observation"
      - name: Observe the original six serial groups once (no retry or repair cell)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_VITEST_FS_MODULE_CACHE_ROOT="$RUNNER_TEMP/vitest-original-cache"
          export NODE_COMPILE_CACHE="$RUNNER_TEMP/node-original-cache"
          set +e
          { time -p node --import tsx scripts/ci-run-node-test-shard.mts; } > "$RUNNER_TEMP/lease-observation/original.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/lease-observation/original.exit"
          cat "$RUNNER_TEMP/lease-observation/original.log"
          node "$GITHUB_WORKSPACE/instructions/.github/proof/pr-151009-observation/controller.mjs" collect "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/lease-observation"
      - name: Check the exact overlay stayed unchanged
        if: always()
        shell: bash
        run: |
          node instructions/.github/proof/pr-151009-observation/controller.mjs verify "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/lease-observation"
      - name: Keep raw observations and failures for causal inspection, not a green CI claim
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lease-observation-tested-merge
          path: ${{ runner.temp }}/lease-observation/
          if-no-files-found: error
          retention-days: 7
