name: Widget error message exact-head changed checks

on:
  push:
    branches: [codex/proof-widget-message-20261007]

permissions:
  contents: read

jobs:
  changed-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 68412b82c639619add3ded8da9a880611a557086
          fetch-depth: 2
          persist-credentials: false
      - name: Provide the official guard's missing ripgrep prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Bind unchanged product head and complete remaining checks
        shell: bash
        env:
          FORCE_COLOR: "0"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "68412b82c639619add3ded8da9a880611a557086"
          test "$(git rev-parse HEAD^)" = "5dcf668765dea9dfc8101e163804c77ca52bdb53"
          test "$(git hash-object src/canvas/wrap.ts)" = "97acfbbb0ab534c34265f015ff2debda58a00a07"
          test "$(git hash-object ui/src/components/canvas-widget-view.ts)" = "19fec1286325959462fcf4c19bd6c508ea4ee63b"
          git diff --check 5dcf668765dea9dfc8101e163804c77ca52bdb53 HEAD
          paths=(src/canvas/wrap.ts src/canvas/wrap.test.ts ui/src/components/canvas-widget-view.ts ui/src/components/canvas-widget-view.test.ts)
          pnpm changed:lanes --json --base 5dcf668765dea9dfc8101e163804c77ca52bdb53 --head HEAD -- "${paths[@]}" 2>&1 | tee "$RUNNER_TEMP/widget-message-final-lanes.log"
          node scripts/check-changed.mjs --dry-run --base 5dcf668765dea9dfc8101e163804c77ca52bdb53 --head HEAD -- "${paths[@]}" 2>&1 | tee "$RUNNER_TEMP/widget-message-final-plan.log"
          node scripts/check-changed.mjs --timed --base 5dcf668765dea9dfc8101e163804c77ca52bdb53 --head HEAD -- "${paths[@]}" 2>&1 | tee "$RUNNER_TEMP/widget-message-final-checks.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: widget-message-exact-head-checks
          path: |
            ${{ runner.temp }}/widget-message-final-*.log
          if-no-files-found: error
