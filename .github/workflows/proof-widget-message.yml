name: Widget PR inherited transcript minute-boundary diagnosis

on:
  push:
    branches: [codex/proof-widget-message-20261007]

permissions:
  contents: read

jobs:
  transcript-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clock: [fixed, crossed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain diagnostic harness and unchanged public-result reporter
        run: |
          cp proof-transcript-minute.mjs proof-widget-message-validator.mjs "$RUNNER_TEMP/"
          git rev-parse HEAD | tee "$RUNNER_TEMP/diagnostic-proof-head.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0dc20916873149b6f6803d1eae711c8d44f3de9e
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: "off"
      - name: Diagnose on the actual upstream main parent, not widget code
        shell: bash
        env:
          FORCE_COLOR: "0"
          CLOCK_CELL: ${{ matrix.clock }}
          WIDGET_MESSAGE_AUDIT_PATH: ${{ runner.temp }}/transcript-minute-audit.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0dc20916873149b6f6803d1eae711c8d44f3de9e"
          node "$RUNNER_TEMP/proof-transcript-minute.mjs" prepare
          git diff -- ui/src/pages/chat/components/chat-transcript-invalidation.test.ts | tee "$RUNNER_TEMP/diagnostic-clock-overlay.log"
          set +e
          pnpm test ui/src/pages/chat/components/chat-transcript-invalidation.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --reporter="$RUNNER_TEMP/proof-widget-message-validator.mjs" --outputFile="$RUNNER_TEMP/transcript-minute.json" 2>&1 | tee "$RUNNER_TEMP/transcript-minute.log"
          result=${PIPESTATUS[0]}
          set -e
          node "$RUNNER_TEMP/proof-transcript-minute.mjs" validate "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: transcript-minute-${{ matrix.clock }}
          path: |
            ${{ runner.temp }}/transcript-minute*
            ${{ runner.temp }}/diagnostic-*.log
            ${{ runner.temp }}/proof-transcript-minute.mjs
          if-no-files-found: error
