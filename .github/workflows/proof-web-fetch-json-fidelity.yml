name: Secretless web_fetch JSON fidelity proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 03512be2f3df16d4ec861ed1bebeaa967c30da2d
      REGRESSION_SHA: af2fa598aab561daf42f68508bcf705736f3d51a
      TEST_FILE: src/agents/tools/web-fetch.json-fidelity.test.ts
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze the reviewed regression and original production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/json-fidelity"
          cp .github/proof/json-fidelity-audit-reporter.mjs "${RUNNER_TEMP}/json-fidelity/audit-reporter.mjs"
          git fetch --depth=1 --no-tags https://github.com/ly85206559/openclaw.git "${REGRESSION_SHA}"
          git show "${REGRESSION_SHA}:${TEST_FILE}" > "${RUNNER_TEMP}/json-fidelity/reviewed.test.ts"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          test ! -e "${TEST_FILE}"
          cp "${RUNNER_TEMP}/json-fidelity/reviewed.test.ts" "${TEST_FILE}"
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/json-fidelity/baseline-source.txt"
          sha256sum "src/agents/tools/web-fetch.ts" "${TEST_FILE}" "${RUNNER_TEMP}/json-fidelity/audit-reporter.mjs" | tee "${RUNNER_TEMP}/json-fidelity/reviewed-sha256.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install pinned dependencies in the secretless runner
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          { node --version; pnpm --version; } | tee "${RUNNER_TEMP}/json-fidelity/toolchain.txt"
      - name: Format only the new regression on the permitted host
        run: |
          pnpm exec oxfmt --write --threads=1 "${TEST_FILE}"
          cp "${TEST_FILE}" "${RUNNER_TEMP}/json-fidelity/formatted.test.ts"
          sha256sum "${TEST_FILE}" | tee "${RUNNER_TEMP}/json-fidelity/executed-fixture-sha256.txt"
      - name: Baseline real HTTP tool regression must be RED
        shell: bash
        env:
          PROOF_AUDIT_PATH: ${{ runner.temp }}/json-fidelity/runner-audit.json
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/json-fidelity/red-wall.txt" \
            node scripts/run-vitest.mjs "${TEST_FILE}" --maxWorkers=1 \
            --reporter=verbose --reporter=json --reporter="${RUNNER_TEMP}/json-fidelity/audit-reporter.mjs" \
            --outputFile="${RUNNER_TEMP}/json-fidelity/red.json" \
            > "${RUNNER_TEMP}/json-fidelity/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/json-fidelity/red.log"
          printf 'exit=%s\n' "${result}" | tee "${RUNNER_TEMP}/json-fidelity/red-exit.txt"
          test "${result}" = 1
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/json-fidelity/red.json', 'utf8'));
          assert.equal(report.numTotalTests, 6);
          assert.equal(report.numFailedTests, 4);
          assert.equal(report.numPassedTests, 2);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.success, false);
          assert.equal(report.testResults.length, 1);
          assert.equal(report.testResults[0].message, '');
          assert.ok(report.testResults[0].name.endsWith(process.env.TEST_FILE));
          const audit = JSON.parse(fs.readFileSync(process.env.PROOF_AUDIT_PATH, 'utf8'));
          assert.equal(audit.reason, 'failed');
          assert.equal(audit.moduleCount, 1);
          assert.equal(audit.unhandledErrors, 0);
          assert.equal(audit.suiteErrors, 0);
          const tests = report.testResults.flatMap(file => file.assertionResults);
          assert.equal(tests.length, 6);
          const failed = tests.filter(test => test.status === 'failed');
          assert.deepEqual(failed.map(test => test.title).sort(), [
            'preserves source literals from /array',
            'preserves source literals from /json',
            'preserves source literals from /scalar',
            'preserves source literals from /vendor-json',
          ].sort());
          for (const test of failed) {
            assert.match(test.failureMessages.join('\n'), /9007199254740993/);
            assert.match(test.failureMessages.join('\n'), /AssertionError/);
          }
          console.log('EXPECTED_BASELINE_RED', JSON.stringify({ tests: 6, failed: 4, controlsPassed: 2, fixtureErrors: 0 }));
          AUDIT
      - name: Retain raw receipts even on fixture or setup failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: json-fidelity-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/json-fidelity
          retention-days: 30
