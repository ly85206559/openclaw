name: SearXNG configured defaults proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        default: "a166c4931a4015935b710070f1a4a1c585b32fb1"
      mode:
        type: choice
        options: [baseline, candidate]
        default: baseline
      native_only:
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || 'a166c4931a4015935b710070f1a4a1c585b32fb1' }}
  PROOF_MODE: ${{ inputs.mode || 'baseline' }}

jobs:
  cli:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ly85206559/openclaw
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: source/package.json
      - name: Bind pristine source and proof
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$PROOF_MODE" in baseline) test "$SOURCE_SHA" = a166c4931a4015935b710070f1a4a1c585b32fb1 ;; candidate) test "$SOURCE_SHA" != a166c4931a4015935b710070f1a4a1c585b32fb1 ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/searxng-defaults-proof"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/searxng-defaults-proof/source-binding.txt"
          sha256sum extensions/searxng/src/searxng-client.ts extensions/searxng/src/searxng-search-provider.ts src/cli/capability-cli/web.ts package.json pnpm-lock.yaml > "$RUNNER_TEMP/searxng-defaults-proof/source-sha256.txt"
          sha256sum ../proof/.proof/searxng-defaults/* > "$RUNNER_TEMP/searxng-defaults-proof/proof-sha256.txt"
          node --check ../proof/.proof/searxng-defaults/cli-defaults.mjs
      - name: Frozen installation
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Canonical runtime build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="$PATH" PNPM_HOME="$PNPM_HOME" CI=true GITHUB_ACTIONS=true NO_COLOR=1 \
            pnpm build qaRuntime > "$RUNNER_TEMP/searxng-defaults-proof/build.log" 2>&1
          cp dist/.buildstamp "$RUNNER_TEMP/searxng-defaults-proof/buildstamp.json"
      - name: Actual supported CLI against loopback SearXNG
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          env -i HOME="$HOME" PATH="$PATH" CI=true GITHUB_ACTIONS=true NO_COLOR=1 \
            SOURCE_SHA="$SOURCE_SHA" PROOF_MODE="$PROOF_MODE" PROOF_OUTPUT_DIR="$RUNNER_TEMP/searxng-defaults-proof" \
            node ../proof/.proof/searxng-defaults/cli-defaults.mjs > "$RUNNER_TEMP/searxng-defaults-proof/proof.log" 2>&1
      - name: Source custody
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sha256sum --check "$RUNNER_TEMP/searxng-defaults-proof/source-sha256.txt"
          sha256sum --check "$RUNNER_TEMP/searxng-defaults-proof/proof-sha256.txt"
          git status --porcelain > "$RUNNER_TEMP/searxng-defaults-proof/final-status.txt"
          test ! -s "$RUNNER_TEMP/searxng-defaults-proof/final-status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: searxng-defaults-${{ env.PROOF_MODE }}-${{ github.run_id }}
          path: ${{ runner.temp }}/searxng-defaults-proof
          if-no-files-found: error

  native:
    if: ${{ inputs.native_only || inputs.mode == 'candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ly85206559/openclaw
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: source/package.json
      - name: Bind exact source and regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$PROOF_MODE" in baseline) test "$SOURCE_SHA" = a166c4931a4015935b710070f1a4a1c585b32fb1 ;; candidate) test "$SOURCE_SHA" != a166c4931a4015935b710070f1a4a1c585b32fb1 ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if [ '${{ inputs.native_only }}' = true ]; then test "$PROOF_MODE" = baseline; fi
          mkdir -p "$RUNNER_TEMP/searxng-native"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/searxng-native/source-binding.txt"
          sha256sum extensions/searxng/src/searxng-client.ts package.json pnpm-lock.yaml > "$RUNNER_TEMP/searxng-native/source-sha256.txt"
          sha256sum ../proof/.proof/searxng-defaults/* > "$RUNNER_TEMP/searxng-native/proof-sha256.txt"
          if [ "$SOURCE_SHA" = a166c4931a4015935b710070f1a4a1c585b32fb1 ]; then
            git apply --unidiff-zero ../proof/.proof/searxng-defaults/regression.patch
          else
            git fetch --no-tags --depth=3 origin "$SOURCE_SHA"
            git merge-base --is-ancestor a166c4931a4015935b710070f1a4a1c585b32fb1 HEAD
          fi
          git apply --unidiff-zero --reverse --check ../proof/.proof/searxng-defaults/regression.patch
          sha256sum extensions/searxng/src/searxng-client.transport.test.ts > "$RUNNER_TEMP/searxng-native/test-sha256.txt"
      - name: Frozen installation
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Native registered provider regression
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          target=extensions/searxng/src/searxng-client.transport.test.ts
          pnpm exec oxfmt --stdin-filepath "$target" < "$target" > "$RUNNER_TEMP/searxng-native/test.formatted.ts"
          cmp "$target" "$RUNNER_TEMP/searxng-native/test.formatted.ts"
          pnpm test "$target" --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/searxng-native/tests.json" > "$RUNNER_TEMP/searxng-native/tests.log" 2>&1
      - name: Candidate provider and client siblings
        if: env.PROOF_MODE == 'candidate'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm test extensions/searxng/src/searxng-client.test.ts extensions/searxng/src/searxng-search-provider.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/searxng-native/siblings.json" > "$RUNNER_TEMP/searxng-native/siblings.log" 2>&1
      - name: Candidate full scoped checker
        if: env.SOURCE_SHA != 'a166c4931a4015935b710070f1a4a1c585b32fb1'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          {
            node scripts/check-changed.mjs --base a166c4931a4015935b710070f1a4a1c585b32fb1 --head "$SOURCE_SHA" --dry-run -- extensions/searxng/src/searxng-client.ts extensions/searxng/src/searxng-client.transport.test.ts
            node scripts/check-changed.mjs --base a166c4931a4015935b710070f1a4a1c585b32fb1 --head "$SOURCE_SHA" -- extensions/searxng/src/searxng-client.ts extensions/searxng/src/searxng-client.transport.test.ts
          } > "$RUNNER_TEMP/searxng-native/checks.log" 2>&1
      - name: Source custody and no-skips audit
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sha256sum --check "$RUNNER_TEMP/searxng-native/source-sha256.txt"
          sha256sum --check "$RUNNER_TEMP/searxng-native/proof-sha256.txt"
          sha256sum --check "$RUNNER_TEMP/searxng-native/test-sha256.txt"
          git status --porcelain > "$RUNNER_TEMP/searxng-native/final-status.txt"
          if [ "$SOURCE_SHA" = a166c4931a4015935b710070f1a4a1c585b32fb1 ]; then
            test "$(cat "$RUNNER_TEMP/searxng-native/final-status.txt")" = ' M extensions/searxng/src/searxng-client.transport.test.ts'
          else
            test ! -s "$RUNNER_TEMP/searxng-native/final-status.txt"
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/searxng-native/tests.json`, 'utf8'));
          assert.equal(result.numTotalTests, 5);
          assert.equal(result.numPendingTests, 0);
          assert.equal(result.numTodoTests, 0);
          assert.equal(result.numPassedTests + result.numFailedTests, 5);
          assert.equal(result.testResults.length, 1);
          assert.equal(result.testResults[0].assertionResults.length, 5);
          assert.ok(result.testResults[0].assertionResults.every((test) => ['passed', 'failed'].includes(test.status)));
          if (process.env.PROOF_MODE === 'candidate') {
            assert.equal(result.numPassedTests, 5);
            assert.equal(result.numFailedTests, 0);
            assert.equal(result.success, true);
            const siblings = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/searxng-native/siblings.json`, 'utf8'));
            assert.equal(siblings.numTotalTests, 14);
            assert.equal(siblings.numPassedTests, 14);
            assert.equal(siblings.numFailedTests, 0);
            assert.equal(siblings.numPendingTests, 0);
            assert.equal(siblings.numTodoTests, 0);
            assert.equal(siblings.success, true);
          } else {
            assert.equal(result.numPassedTests, 3);
            assert.equal(result.numFailedTests, 2);
            assert.equal(result.success, false);
            const failed = result.testResults[0].assertionResults.filter((test) => test.status === 'failed');
            assert.deepEqual(failed.map((test) => test.title), [
              'uses configured result counts without sharing cached results across counts',
              'applies the configured timeout to the real request while allowing a longer budget',
            ]);
            assert.match(failed[0].failureMessages.join('\n'), /AssertionError/);
            assert.match(failed[0].failureMessages.join('\n'), /to match object \{ count: 1[,}]/);
            assert.match(failed[1].failureMessages.join('\n'), /promise resolved[\s\S]*instead of rejecting/);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: searxng-native-${{ github.run_id }}
          path: ${{ runner.temp }}/searxng-native
          if-no-files-found: error
