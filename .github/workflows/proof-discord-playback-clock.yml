name: Discord playback watchdog clock proof

on:
  push:
    branches: [codex/proof-discord-playback-clock-20261003]
    paths: [".github/workflows/proof-discord-playback-clock.yml", ".github/proofs/discord-playback-clock/**", "extensions/discord/src/voice/realtime-playback.test.ts"]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: red
            repository: openclaw/openclaw
            source: 32e30e59d9a7fd1f5b3a9e9659427d45145779dd
          - phase: green
            repository: ly85206559/openclaw
            source: b61076e6faf38c353c016a9739935e11d41f157e
    env:
      SOURCE_SHA: ${{ matrix.source }}
      PROOF_EXPECT: ${{ matrix.phase }}
      OPENCLAW_STATE_DIR: /tmp/discord-playback-clock-state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: source/package.json
      - name: Install locked dependencies without secrets
        working-directory: source
        run: pnpm install --frozen-lockfile
      # Exact b610 regression/fmt/lint/types GREEN37036653431 remains valid.
      - name: Verify exact source with no overlay and prepare supported imports
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          pnpm openclaw --version
          test -z "$(git status --porcelain)"
      - name: Production output, real voice SDK/resource and libopus clock-shift trace
        working-directory: source
        run: node --import ./scripts/tsx.mjs ../proof-assets/.github/proofs/discord-playback-clock/runtime.mjs
