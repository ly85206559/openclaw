name: Discord playback watchdog clock proof

on:
  push:
    branches: [codex/proof-discord-playback-clock-20261003]
    paths: [".github/workflows/proof-discord-playback-clock.yml", ".github/proofs/discord-playback-clock/**", "extensions/discord/src/voice/realtime-playback.test.ts"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: b61076e6faf38c353c016a9739935e11d41f157e
      PROOF_EXPECT: green
      OPENCLAW_STATE_DIR: /tmp/discord-playback-clock-state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ly85206559/openclaw
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: source/package.json
      - name: Install locked dependencies without secrets
        working-directory: source
        run: pnpm install --frozen-lockfile
      # Baseline RED37034749362 is already successful and retained unchanged.
      - name: Verify exact candidate with no regression overlay
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Changed-file formatting and lint
        working-directory: source
        run: |
          if ! pnpm exec oxfmt --check extensions/discord/src/voice/realtime-output.runtime.ts extensions/discord/src/voice/realtime-playback.test.ts; then
            pnpm exec oxfmt --write extensions/discord/src/voice/realtime-playback.test.ts
            git diff -- extensions/discord/src/voice/realtime-playback.test.ts
            exit 1
          fi
          node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json extensions/discord/src/voice/realtime-output.runtime.ts extensions/discord/src/voice/realtime-playback.test.ts
          git diff --check
      - name: Real manager, worker, audio sink and player watchdog GREEN
        working-directory: source
        run: node ../proof-assets/.github/proofs/discord-playback-clock/tests.mjs
      - name: Proportional plugin production and test type graphs
        working-directory: source
        run: |
          pnpm tsgo:extensions
          pnpm tsgo:extensions:test
