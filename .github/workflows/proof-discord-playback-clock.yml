name: Discord playback watchdog clock proof

on:
  push:
    branches: [codex/proof-discord-playback-clock-20261003]
    paths: [".github/workflows/proof-discord-playback-clock.yml", ".github/proofs/discord-playback-clock/**", "extensions/discord/src/voice/realtime-playback.test.ts"]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 32e30e59d9a7fd1f5b3a9e9659427d45145779dd
      PROOF_EXPECT: red
      OPENCLAW_STATE_DIR: /tmp/discord-playback-clock-state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: openclaw/openclaw
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: source/package.json
      - name: Install locked dependencies without secrets
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Verify untouched production and install regression matrix
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cp ../proof-assets/extensions/discord/src/voice/realtime-playback.test.ts extensions/discord/src/voice/realtime-playback.test.ts
          test -z "$(git diff --name-only -- extensions/discord/src/voice/realtime-output.runtime.ts)"
      - name: Real manager, worker, audio sink and player watchdog RED
        working-directory: source
        run: node ../proof-assets/.github/proofs/discord-playback-clock/tests.mjs
