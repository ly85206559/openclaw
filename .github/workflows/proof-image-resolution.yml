name: Secretless image resolution baseline proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 03512be2f3df16d4ec861ed1bebeaa967c30da2d
      REGRESSION_SHA: 9e272fc5b2159b7bdc47295d08a1added40bf169
      TEST_FILE: src/cli/capability-cli.test.ts
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze original owner and reviewed command regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/image-resolution"
          cp .github/proof/image-resolution-audit-reporter.mjs "${RUNNER_TEMP}/image-resolution/audit-reporter.mjs"
          cp .github/proof/image-resolution-cli.mjs "${RUNNER_TEMP}/image-resolution/cli.mjs"
          git fetch --depth=1 --no-tags https://github.com/ly85206559/openclaw.git "${REGRESSION_SHA}"
          git show "${REGRESSION_SHA}:${TEST_FILE}" > "${RUNNER_TEMP}/image-resolution/reviewed.test.ts"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          cp "${RUNNER_TEMP}/image-resolution/reviewed.test.ts" "${TEST_FILE}"
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/image-resolution/baseline-source.txt"
          sha256sum src/cli/capability-cli/image.ts "${TEST_FILE}" | tee "${RUNNER_TEMP}/image-resolution/reviewed-sha256.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: true
          cache-mode: off
      - name: Format only the changed regression on the permitted host
        run: |
          { node --version; pnpm --version; } | tee "${RUNNER_TEMP}/image-resolution/toolchain.txt"
          pnpm exec oxfmt --write --threads=1 "${TEST_FILE}"
          cp "${TEST_FILE}" "${RUNNER_TEMP}/image-resolution/formatted.test.ts"
          sha256sum "${TEST_FILE}" | tee "${RUNNER_TEMP}/image-resolution/executed-fixture-sha256.txt"
      - name: Original-order command suite must fail exactly five resolution assertions
        shell: bash
        env:
          PROOF_AUDIT_PATH: ${{ runner.temp }}/image-resolution/runner-audit.json
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/image-resolution/red-wall.txt" \
            node scripts/run-vitest.mjs "${TEST_FILE}" --maxWorkers=1 --reporter=verbose --reporter=json \
            --reporter="${RUNNER_TEMP}/image-resolution/audit-reporter.mjs" --outputFile="${RUNNER_TEMP}/image-resolution/red.json" \
            > "${RUNNER_TEMP}/image-resolution/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/image-resolution/red.log"
          printf 'exit=%s\n' "$result" | tee "${RUNNER_TEMP}/image-resolution/red-exit.txt"
          test "$result" = 1
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/image-resolution/red.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync(process.env.PROOF_AUDIT_PATH, 'utf8'));
          assert.equal(report.success, false);
          assert.ok(report.numTotalTests > 7);
          assert.equal(report.numFailedTests, 5);
          assert.equal(report.numPassedTests, report.numTotalTests - 5);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.testResults.length, 1);
          assert.ok(report.testResults[0].name.endsWith(process.env.TEST_FILE));
          assert.equal(report.testResults[0].message, '');
          assert.equal(audit.reason, 'failed');
          assert.equal(audit.moduleCount, 1);
          assert.equal(audit.unhandledErrors, 0);
          assert.equal(audit.suiteErrors, 0);
          const failed = report.testResults[0].assertionResults.filter(test => test.status === 'failed');
          assert.deepEqual(failed.map(test => test.title).sort(), [
            'rejects image generate resolution 1080p before dispatch',
            'rejects image edit resolution 1080p before dispatch',
            'rejects image generate resolution 8K before dispatch',
            'rejects image edit resolution 8K before dispatch',
            'forwards canonical image resolution 2K',
          ].sort());
          for (const test of failed) {
            const message = test.failureMessages.join('\n');
            if (test.title.startsWith('rejects image ')) {
              assert.match(message, /promise resolved "undefined" instead of rejecting/);
            } else {
              assert.match(message, /expected ' 2k ' to be '2K'/);
            }
          }
          console.log('EXPECTED_BASELINE_RED', JSON.stringify({ tests:report.numTotalTests, failed:5, fixtureErrors:0 }));
          AUDIT
      - name: Canonical build for the actual supported CLI
        run: pnpm build > "${RUNNER_TEMP}/image-resolution/build.log" 2>&1
      - name: Actual supported CLI rejects the model instead of invalid resolution
        env:
          PROOF_MODE: baseline
        run: node "${RUNNER_TEMP}/image-resolution/cli.mjs" > "${RUNNER_TEMP}/image-resolution/cli.log" 2>&1
      - name: Retain raw receipts even on setup or fixture failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-resolution-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/image-resolution
          retention-days: 30
