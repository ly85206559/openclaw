name: Web fetch code literal red and green proof

on:
  push:
    branches: [codex/proof-web-fetch-code-20261004]
    paths: [".github/workflows/proof-web-fetch-code.yml"]

permissions:
  contents: read

jobs:
  focused-proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [red, green]
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      PROOF_LANE: ${{ matrix.lane }}
      SOURCE_SHA: 11607856403e83fb879109457dde6d217c1cce1b
      BASE_SHA: 4d2617d425ab247a2f55a18523da8cc6a483746c
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
    steps:
      - name: Prepare isolated container tooling
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          apt-get update -qq
          apt-get install -y ca-certificates git ripgrep curl xz-utils libatomic1 python3 python3-venv time
      - name: Check out the pinned candidate including regression tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 8
      - name: Assert identity and select the production implementation
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          if [ "$PROOF_LANE" = red ]; then
            git restore --source="$BASE_SHA" --worktree -- src/agents/tools/web-fetch-utils.ts
            test "$(git hash-object src/agents/tools/web-fetch-utils.ts)" = "$(git rev-parse "$BASE_SHA:src/agents/tools/web-fetch-utils.ts")"
            test "$(git diff --name-only)" = src/agents/tools/web-fetch-utils.ts
          else
            git diff --exit-code
          fi
          for test_file in src/agents/tools/web-fetch-utils.test.ts src/agents/tools/web-fetch-visibility.tool-extraction.test.ts src/agents/tools/web-fetch.cf-markdown.test.ts; do
            test "$(git hash-object "$test_file")" = "$(git rev-parse "$SOURCE_SHA:$test_file")"
          done
          printf 'LANE=%s CANDIDATE_SHA=%s BASE_SHA=%s PLATFORM=ubuntu:24.04\n' "$PROOF_LANE" "$SOURCE_SHA" "$BASE_SHA"
          printf 'Both lanes use identical candidate tests; red restores only web-fetch-utils.ts from base.\n'
          git diff --stat "$BASE_SHA"...HEAD
      - name: Install the selected Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Install the source-declared pnpm version
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Verify source toolchain pins
        run: |
          set -euo pipefail
          npm install --global corepack@0.36.0
          expected_pnpm="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.match(/^pnpm@([^+]+)/)[1]')"
          test "$(pnpm --version)" = "$expected_pnpm"
          test "$(corepack pnpm --version)" = "$expected_pnpm"
          node -p 'JSON.stringify({node:process.version,platform:process.platform,packageManager:JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager,engines:JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines})'
      - name: Install frozen dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Run each focused file with JSON evidence and no retries
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/web-fetch-code-$PROOF_LANE"
          mkdir -p "$proof_dir"
          printf 'PROOF_DIR=%s\n' "$proof_dir" >> "$GITHUB_ENV"
          : > "$proof_dir/runs.tsv"
          cat > "$proof_dir/runtime-errors-reporter.mjs" <<'REPORTER'
          import fs from "node:fs";
          export default class RuntimeErrorsReporter {
            onTestRunEnd(modules, errors, reason) {
              const suiteErrors = [];
              const visit = (task) => {
                if (task.type === "suite") {
                  for (const error of task.result?.errors ?? []) {
                    suiteErrors.push({ name: task.name, message: error.message });
                  }
                  for (const child of task.tasks ?? []) visit(child);
                }
              };
              for (const module of modules) visit(module.task);
              fs.writeFileSync(process.env.PROOF_ERRORS_FILE, JSON.stringify({ errors, reason, suiteErrors }));
            }
          }
          REPORTER
          tests=(src/agents/tools/web-fetch-utils.test.ts src/agents/tools/web-fetch-visibility.tool-extraction.test.ts src/agents/tools/web-fetch.cf-markdown.test.ts)
          for test_file in "${tests[@]}"; do
            report="$proof_dir/$(basename "$test_file").json"
            printf 'LANE=%s CANDIDATE_SHA=%s TEST_FILE=%s MAX_WORKERS=1 RETRY=0\n' "$PROOF_LANE" "$SOURCE_SHA" "$test_file"
            set +e
            PROOF_ERRORS_FILE="$report.errors.json" /usr/bin/time -f "PROOF_TIMING lane=$PROOF_LANE source=$SOURCE_SHA file=$test_file wall_seconds=%e user_seconds=%U system_seconds=%S exit=%x" \
              node scripts/run-vitest.mjs "$test_file" --maxWorkers=1 --retry=0 --reporter=default --reporter=json --reporter="$proof_dir/runtime-errors-reporter.mjs" --outputFile="$report"
            test_exit=$?
            set -e
            printf '%s\t%s\t%s\n' "$test_file" "$report" "$test_exit" >> "$proof_dir/runs.tsv"
          done
      - name: Validate exact red assertions or complete green proof
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const unitSuite = "web-fetch-utils htmlToMarkdown entity decoding";
          const boundaryTitle = `${unitSuite} preserves fenced code literals and existing extraction boundaries: `;
          const toolSuite = "web_fetch visibility through the real tool execute path";
          const literalInput = "```md\n# comment\n- literal\n1. literal\n[label](https://example.com)\n![alt](image.png)\n`value`\n```";
          const expectedFailures = new Set([
            boundaryTitle + literalInput,
            `${toolSuite} preserves code examples through HTTP Markdown extraction in text mode`,
          ]);
          const requiredControls = [
            boundaryTitle + "\0![](u)\0" + "0" + "\0![](u)\0",
            `${unitSuite} keeps code extraction bounded when prose contains long NUL runs`,
            boundaryTitle + "[```label```](https://example.com)",
            boundaryTitle + "```text\ncode\n```# heading",
            boundaryTitle + "\0```text\n$&\n```",
            boundaryTitle + "before```text\ncode```# tail",
            boundaryTitle + "```js\n# heading",
            boundaryTitle + "before\n```text\n  # literal \r\n\r\n\r\n  body\n```\nafter",
            `${unitSuite} strips markdown fences in a forward pass without changing adjacent fence output`,
            `${unitSuite} keeps blank lines between paragraphs, headings, and lists in text mode`,
            `${unitSuite} keeps paragraph and list-item separation with CRLF line endings`,
            `${toolSuite} preserves code examples through HTTP Markdown extraction in markdown mode`,
          ];
          const expectedFiles = new Set([
            "src/agents/tools/web-fetch-utils.test.ts",
            "src/agents/tools/web-fetch-visibility.tool-extraction.test.ts",
            "src/agents/tools/web-fetch.cf-markdown.test.ts",
          ]);
          const runs = fs.readFileSync(`${process.env.PROOF_DIR}/runs.tsv`, "utf8").trim().split("\n");
          assert.equal(runs.length, expectedFiles.size, "Every focused file must have a report");
          const assertions = [];
          const fileSummaries = [];
          for (const run of runs) {
            const [file, reportPath, exitText] = run.split("\t");
            assert(expectedFiles.delete(file), `Unexpected or repeated file: ${file}`);
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
            // Vitest 5's built-in JSON omits unhandled errors; collect them through its reporter API.
            const runtime = JSON.parse(fs.readFileSync(`${reportPath}.errors.json`, "utf8"));
            assert.deepEqual(runtime.errors, [], `${file}: unhandled runtime errors`);
            assert.deepEqual(runtime.suiteErrors, [], `${file}: suite or hook errors`);
            assert(runtime.reason === "passed" || runtime.reason === "failed", `${file}: interrupted run`);
            assert.equal(report.numPendingTests, 0, `${file}: skipped tests are not proof`);
            assert.equal(report.numTodoTests, 0, `${file}: todo tests are not proof`);
            assert(Array.isArray(report.testResults) && report.testResults.length > 0);
            const current = report.testResults.flatMap((suite) => {
              assert(suite.name.replaceAll("\\", "/").endsWith(`/${file}`), `Wrong report source: ${suite.name}`);
              assert.equal(suite.message, "", `${file}: module or hook error`);
              assert(Array.isArray(suite.assertionResults) && suite.assertionResults.length > 0, `${file}: no collected tests`);
              return suite.assertionResults;
            });
            assert.equal(report.numTotalTests, current.length, `${file}: incomplete assertion inventory`);
            assert(current.every((test) => test.status === "passed" || test.status === "failed"));
            const failed = current.filter((test) => test.status === "failed");
            assert.equal(report.numFailedTests, failed.length);
            assert.equal(report.numPassedTests, current.length - failed.length);
            assert.equal(report.success, failed.length === 0);
            assert.equal(runtime.reason, failed.length > 0 ? "failed" : "passed");
            assert.equal(Number(exitText), failed.length > 0 ? 1 : 0, `${file}: process failure does not match test assertions`);
            for (const test of failed) {
              assert(expectedFailures.has(test.fullName), `Unexpected failed assertion: ${test.fullName}`);
              assert(test.failureMessages.some((message) => message.includes("AssertionError")), `Not an assertion failure: ${test.fullName}`);
            }
            assertions.push(...current);
            fileSummaries.push({ file, tests: current.length, failed: failed.length, exit: Number(exitText) });
          }
          assert.equal(expectedFiles.size, 0);
          const failed = assertions.filter((test) => test.status === "failed");
          if (process.env.PROOF_LANE === "red") {
            assert.equal(failed.length, 2, "Baseline must fail only the two literal-content regressions");
            assert.deepEqual(new Set(failed.map((test) => test.fullName)), expectedFailures);
          } else {
            assert.equal(process.env.PROOF_LANE, "green");
            assert.equal(failed.length, 0, "Candidate must pass every assertion");
            for (const name of expectedFailures) {
              assert.equal(assertions.filter((test) => test.fullName === name && test.status === "passed").length, 1);
            }
          }
          for (const name of requiredControls) {
            assert.equal(assertions.filter((test) => test.fullName === name && test.status === "passed").length, 1, `Missing passing negative control: ${name}`);
          }
          const summary = {
            lane: process.env.PROOF_LANE,
            candidateSha: process.env.SOURCE_SHA,
            baselineSha: process.env.BASE_SHA,
            files: fileSummaries,
            failedAssertions: failed.map((test) => ({ name: test.fullName, messages: test.failureMessages })),
            passingControls: requiredControls,
            realHttpToolProof: true,
            liveGatewayOrExternalProviderProof: false,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### ${process.env.PROOF_LANE} proof\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);
          NODE
      - name: Check the complete green product diff
        if: matrix.lane == 'green'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -d '' -t changed_paths < <(git diff --name-only -z "$BASE_SHA"...HEAD)
          test "${#changed_paths[@]}" -eq 3
          printf 'FULL_DIFF_BASE=%s SOURCE_SHA=%s\n' "$BASE_SHA" "$SOURCE_SHA"
          printf 'CHANGED_FILE=%s\n' "${changed_paths[@]}"
          pnpm exec oxfmt --check "${changed_paths[@]}"
          git diff --check "$BASE_SHA"...HEAD
          node scripts/check-changed.mjs --base "$BASE_SHA" --dry-run -- "${changed_paths[@]}"
          node scripts/check-changed.mjs --base "$BASE_SHA" -- "${changed_paths[@]}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Recheck source and test identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          for test_file in src/agents/tools/web-fetch-utils.test.ts src/agents/tools/web-fetch-visibility.tool-extraction.test.ts src/agents/tools/web-fetch.cf-markdown.test.ts; do
            test "$(git hash-object "$test_file")" = "$(git rev-parse "$SOURCE_SHA:$test_file")"
          done
          if [ "$PROOF_LANE" = red ]; then
            test "$(git hash-object src/agents/tools/web-fetch-utils.ts)" = "$(git rev-parse "$BASE_SHA:src/agents/tools/web-fetch-utils.ts")"
            test "$(git diff --name-only)" = src/agents/tools/web-fetch-utils.ts
          else
            git diff --exit-code
          fi
