name: Secretless Control UI preload proof

on:
  push:
    branches:
      - codex/proof-control-ui-preload-20261018

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: current-main-test-only-red
            target_ref: 9aeedd645ad7af79dc5af6f187f86193823ab9a3
            expect_failure: true
            os: ubuntu-24.04
          - name: fixed-head-green
            target_ref: fc8788d9985d4c9a94fea722fb39571b6f040ed3
            expect_failure: false
            os: ubuntu-24.04
          - name: current-main-test-only-red
            target_ref: 9aeedd645ad7af79dc5af6f187f86193823ab9a3
            expect_failure: true
            os: windows-2025
          - name: fixed-head-green
            target_ref: fc8788d9985d4c9a94fea722fb39571b6f040ed3
            expect_failure: false
            os: windows-2025
    name: ${{ matrix.name }} (${{ matrix.os }})
    steps:
      - name: Checkout exact proof target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.9.0 --activate
          node --version
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run owning boundary test
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECT_FAILURE: ${{ matrix.expect_failure }}
          TARGET_REF: ${{ matrix.target_ref }}
        run: |
          set +e
          pnpm test test/scripts/control-ui-performance-base.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/test.log"
          test_status=${PIPESTATUS[0]}
          set -e
          echo "target=$TARGET_REF node=$(node --version) pnpm=$(pnpm --version) test_exit=$test_status"
          if [[ "$EXPECT_FAILURE" == "true" ]]; then
            if [[ "$test_status" -eq 0 ]]; then
              echo "Expected the test-only current-main target to fail." >&2
              exit 1
            fi
          elif [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi

      - name: Run native Windows Node preload boundary
        if: runner.os == 'Windows'
        shell: bash
        env:
          EXPECT_FAILURE: ${{ matrix.expect_failure }}
          TARGET_REF: ${{ matrix.target_ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const checkoutRoot = process.cwd();
          const tempRoot = fs.mkdtempSync(path.join(os.tmpdir(), "control-ui preload #"));
          const repoRoot = path.join(tempRoot, "repo # space");
          const expectedFailure = process.env.EXPECT_FAILURE === "true";
          const files = [
            "scripts/tsx.mjs",
            "scripts/lib/tsx-cli-shim.mjs",
            "scripts/lib/local-check-runtime.mts",
            "scripts/lib/managed-cleanup-handoff.mts",
          ];
          try {
            for (const file of files) {
              const target = path.join(repoRoot, file);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.copyFileSync(path.join(checkoutRoot, file), target);
            }
            fs.symlinkSync(path.join(checkoutRoot, "node_modules"), path.join(repoRoot, "node_modules"), "junction");
            const loaderPath = path.join(repoRoot, "scripts/tsx.mjs");
            const importArg = expectedFailure ? loaderPath : pathToFileURL(loaderPath).href;
            const result = spawnSync(
              process.execPath,
              ["--import", importArg, "-e", "process.stdout.write('preload-ok')"],
              { cwd: repoRoot, encoding: "utf8" },
            );
            const errorMessage = result.error?.message ?? "";
            console.log(`target=${process.env.TARGET_REF} node=${process.version} mode=${expectedFailure ? "raw-path" : "file-url"} exit=${result.status} spawnError=${errorMessage}`);
            if (result.stderr) console.log(result.stderr.trim());
            assert.equal(result.error, undefined, `Node failed to start: ${errorMessage}`);
            if (expectedFailure) {
              assert.notEqual(result.status, 0, "raw path unexpectedly loaded the preload");
              assert.match(result.stderr, /tsx\.mjs/u, "baseline failed for an unrelated reason");
            } else {
              assert.equal(result.status, 0, result.stderr);
              assert.match(result.stdout, /preload-ok/u);
            }
          } finally {
            fs.rmSync(tempRoot, { recursive: true, force: true });
          }
          NODE
