name: Secretless Google Chat HTTP error status proof

on:
  push:
    branches: [codex/proof-googlechat-error-status-20261010]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact fork candidate SHA; empty runs the baseline only
        required: false
        type: string

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 14b764a9c338f3e55d98160b004ab71ad01cc10e
      TARGET_SHA: ${{ inputs.target_sha }}
      TEST_FILE: extensions/googlechat/src/api.fetchok.transport.test.ts
      OWNER_FILE: extensions/googlechat/src/api.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve regression and freeze current-main production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          cp .github/proof/googlechat-error-status.fixture.ts "${RUNNER_TEMP}/proof/regression.test.ts"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          printf 'baseline=%s\nowner=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:${OWNER_FILE})" | tee "${RUNNER_TEMP}/proof/source.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Prepare isolated frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node --version | tee "${RUNNER_TEMP}/proof/node-version.txt"
          pnpm --version | tee "${RUNNER_TEMP}/proof/pnpm-version.txt"
      - name: Observe current-main collected failures and ambiguity controls
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/proof/regression.test.ts" "${TEST_FILE}"
          test "$(git hash-object "${OWNER_FILE}")" = "$(git rev-parse ${BASE_SHA}:${OWNER_FILE})"
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/red-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" -t 'only resends a typing reply after an authoritative 404' --reporter=verbose > "${RUNNER_TEMP}/proof/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/proof/red.log"
          printf 'exit=%s\n' "${result}" | tee "${RUNNER_TEMP}/proof/red-exit.txt"
          test "${result}" = 1
          grep -q '5 failed' "${RUNNER_TEMP}/proof/red.log"
          grep -q '2 passed' "${RUNNER_TEMP}/proof/red.log"
          grep -q 'AssertionError' "${RUNNER_TEMP}/proof/red.log"
          grep -q 'GOOGLECHAT_TYPING_RECEIPT' "${RUNNER_TEMP}/proof/red.log"
          grep -q 'terminated' "${RUNNER_TEMP}/proof/red.log"
          git restore --source=HEAD --worktree -- "${TEST_FILE}"
          git diff --exit-code
      - name: Exact candidate green and unchanged ambiguity controls
        if: ${{ inputs.target_sha != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=16 --no-tags https://github.com/ly85206559/openclaw.git "${TARGET_SHA}"
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          test "$(git diff --name-only "${BASE_SHA}" HEAD | sort)" = "$(printf '%s\n' "${OWNER_FILE}" "${TEST_FILE}" | sort)"
          cmp "${RUNNER_TEMP}/proof/regression.test.ts" "${TEST_FILE}"
          git diff --check "${BASE_SHA}" HEAD
          pnpm exec oxfmt --check "${OWNER_FILE}" "${TEST_FILE}"
          pnpm exec oxlint --config .oxlintrc.json "${OWNER_FILE}" "${TEST_FILE}"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/green-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" extensions/googlechat/src/monitor.reply-delivery.test.ts --reporter=verbose > "${RUNNER_TEMP}/proof/green.log" 2>&1
          cat "${RUNNER_TEMP}/proof/green.log"
          grep -q 'GOOGLECHAT_TYPING_RECEIPT' "${RUNNER_TEMP}/proof/green.log"
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/proof/final-source.txt"
      - name: Retain native request, error, status, and timing receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: googlechat-error-status-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          retention-days: 30
