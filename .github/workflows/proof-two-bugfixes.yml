name: Secretless CLI contract baseline flows

on:
  push:
    branches: [codex/proof-cli-contracts-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: model
            head: 73da41b2e9afaadc22e2581927350562b26049f1
            test: src/cli/capability-cli/model.run-reasoning-only.test.ts
            fixture: model-real-cli-proof.mjs
          - lane: meeting
            head: 8aae280a552b3d4a5cde58f52ea78b50e0139b80
            test: src/meeting-bot/plugin-cli.test.ts
            fixture: meeting-real-cli-proof.mjs
    env:
      BASE_SHA: 4938f90b94a574ac7629b227f6097c6d63a3ce9b
      TARGET_SHA: ${{ matrix.head }}
      TEST_FILE: ${{ matrix.test }}
      FIXTURE: ${{ matrix.fixture }}
      LANE: ${{ matrix.lane }}
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze baseline product and retained fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          cp ".github/proof/${FIXTURE}" "${RUNNER_TEMP}/proof/${FIXTURE}"
          sha256sum "${RUNNER_TEMP}/proof/${FIXTURE}" | tee "${RUNNER_TEMP}/proof/fixture-sha256.txt"
          git fetch --no-tags --depth=2 https://github.com/ly85206559/openclaw.git "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}^")" = "${BASE_SHA}"
          test "$(git diff --name-only "${BASE_SHA}" "${TARGET_SHA}")" = "${TEST_FILE}"
          git checkout --detach "${TARGET_SHA}"
          printf 'base=%s\nhead=%s\ntree=%s\n' "${BASE_SHA}" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "${RUNNER_TEMP}/proof/source.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Frozen secretless dependencies and canonical build
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}"
          corepack enable
          pnpm install --frozen-lockfile
          test "$(pnpm --version)" = 12.7.0
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/build-wall.txt" pnpm build > "${RUNNER_TEMP}/proof/build.log" 2>&1
          cat "${RUNNER_TEMP}/proof/build.log"
      - name: Supported CLI baseline behavior and controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          if test "${LANE}" = model; then
            node "${RUNNER_TEMP}/proof/${FIXTURE}" baseline "${RUNNER_TEMP}/proof/model-flow" | tee "${RUNNER_TEMP}/proof/flow.log"
          else
            node "${RUNNER_TEMP}/proof/${FIXTURE}" "$PWD" baseline "${RUNNER_TEMP}/proof/meeting-flow.json" | tee "${RUNNER_TEMP}/proof/flow.log"
          fi
          git diff --exit-code
      - name: Retain exact-source original flow outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-baseline-flow-${{ matrix.lane }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          retention-days: 30
