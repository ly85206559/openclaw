name: Secretless meeting test formatting diagnosis

on:
  push:
    branches: [codex/proof-cli-contracts-20261009]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meeting-format:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: 336f95da6148e8d029a7b8acda97c9f0675a8c8d
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze exact failing formatting input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          git fetch --no-tags --depth=5 https://github.com/ly85206559/openclaw.git "${TARGET_SHA}"
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          printf 'head=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "${RUNNER_TEMP}/proof/source.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Frozen secretless dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}${GITHUB_TOKEN:-}${AWS_ACCESS_KEY_ID:-}${AWS_SECRET_ACCESS_KEY:-}"
          corepack enable
          pnpm install --frozen-lockfile
          test "$(pnpm --version)" = 12.7.0
      - name: Canonical formatter output for the failed test only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec oxfmt src/meeting-bot/plugin-cli.test.ts
          test "$(git diff --name-only)" = src/meeting-bot/plugin-cli.test.ts
          git diff --check
          git diff -- src/meeting-bot/plugin-cli.test.ts | tee "${RUNNER_TEMP}/proof/formatter.patch"
          cp src/meeting-bot/plugin-cli.test.ts "${RUNNER_TEMP}/proof/plugin-cli.test.ts"
          pnpm format:check --no-error-on-unmatched-pattern -- src/meeting-bot/plugin-cli.test.ts
      - name: Retain canonical formatting evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meeting-format-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          retention-days: 30
