name: Secretless CLI failure narration boundary proof

on:
  push:
    branches: [codex/proof-cli-failure-narration-20261009]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact fork candidate SHA; empty runs the baseline only
        required: false
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: c08b6c60ac49d7af8d7ec92adfb85a54e12d5d61
      TARGET_SHA: ${{ inputs.target_sha }}
      TEST_FILE: src/auto-reply/reply/progress-narrator.test.ts
      OWNER_FILE: src/auto-reply/reply/agent-runner-command-output.ts
      CLI_PROOF_FILE: src/auto-reply/reply/agent-runner-execution-cli-progress.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve regression and freeze production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/proof"
          cp .github/proof/cli-failure-narration.fixture.ts "${RUNNER_TEMP}/proof/regression.test.ts"
          cp .github/proof/cli-turn-narration.fixture.ts "${RUNNER_TEMP}/proof/cli-turn.test.ts"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          printf 'baseline=%s\nowner=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:${OWNER_FILE})" | tee "${RUNNER_TEMP}/proof/source.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Prepare isolated frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node --version
          pnpm --version
      - name: Observe real projector to registered narration input on baseline
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/proof/regression.test.ts" "${TEST_FILE}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.TEST_FILE;
          const source = fs.readFileSync(path, 'utf8');
          const assertion = 'expect(inputs[0]?.activityNotes).toEqual(["Check build status: failed (exit 1)"]);';
          if (!source.includes(assertion)) throw new Error('missing unchanged regression assertion');
          fs.writeFileSync(path, source.replace(assertion, 'console.info("CLI_NARRATION_RECEIPT", JSON.stringify({ name, outcome, activityNotes: inputs[0]?.activityNotes }));\n      ' + assertion));
          NODE
          cp "${TEST_FILE}" "${RUNNER_TEMP}/proof/instrumented-regression.test.ts"
          test "$(git hash-object "${OWNER_FILE}")" = "$(git rev-parse ${BASE_SHA}:${OWNER_FILE})"
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/red-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" -t 'keeps the authored title in narration' --reporter=verbose > "${RUNNER_TEMP}/proof/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/proof/red.log"
          printf 'exit=%s\n' "${result}" | tee "${RUNNER_TEMP}/proof/red-exit.txt"
          test "${result}" = 1
          grep -q '2 failed' "${RUNNER_TEMP}/proof/red.log"
          grep -q '1 passed' "${RUNNER_TEMP}/proof/red.log"
          grep -q 'AssertionError' "${RUNNER_TEMP}/proof/red.log"
          grep -q 'CLI_NARRATION_RECEIPT' "${RUNNER_TEMP}/proof/red.log"
          git restore --source=HEAD --worktree -- "${TEST_FILE}"
          git diff --exit-code
      - name: Baseline registered production CLI-turn failure and control
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/proof/cli-turn.test.ts" "${CLI_PROOF_FILE}"
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/cli-before-wall.txt" node scripts/run-vitest.mjs "${CLI_PROOF_FILE}" --reporter=verbose > "${RUNNER_TEMP}/proof/cli-before.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/proof/cli-before.log"
          test "${result}" = 1
          grep -q '2 failed' "${RUNNER_TEMP}/proof/cli-before.log"
          grep -q '1 passed' "${RUNNER_TEMP}/proof/cli-before.log"
          grep -q 'AssertionError' "${RUNNER_TEMP}/proof/cli-before.log"
          grep -q 'CLI_TURN_NARRATION_RECEIPT' "${RUNNER_TEMP}/proof/cli-before.log"
          git restore --source=HEAD --worktree -- "${CLI_PROOF_FILE}"
          git diff --exit-code
      - name: Exact candidate green and unchanged controls
        if: ${{ inputs.target_sha != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=16 --no-tags https://github.com/ly85206559/openclaw.git "${TARGET_SHA}"
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          changed_paths="$(git diff --name-only "${BASE_SHA}" HEAD | sort)"
          test "${changed_paths}" = "${OWNER_FILE}" || test "${changed_paths}" = "$(printf '%s\n' "${OWNER_FILE}" "${TEST_FILE}" | sort)"
          git diff --check "${BASE_SHA}" HEAD
          pnpm exec oxfmt --check "${OWNER_FILE}" "${TEST_FILE}"
          pnpm exec oxlint --config .oxlintrc.json "${OWNER_FILE}" "${TEST_FILE}"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/green-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" src/auto-reply/reply/agent-runner-command-output.test.ts src/agents/cli-runner/summary-tracker.test.ts --reporter=verbose > "${RUNNER_TEMP}/proof/green.log" 2>&1
          cat "${RUNNER_TEMP}/proof/green.log"
          git diff --exit-code
          cp "${RUNNER_TEMP}/proof/instrumented-regression.test.ts" "${TEST_FILE}"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/after-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" -t 'keeps the authored title in narration' --reporter=verbose > "${RUNNER_TEMP}/proof/after.log" 2>&1
          cat "${RUNNER_TEMP}/proof/after.log"
          grep -q '3 passed' "${RUNNER_TEMP}/proof/after.log"
          grep -q 'CLI_NARRATION_RECEIPT' "${RUNNER_TEMP}/proof/after.log"
          git restore --source=HEAD --worktree -- "${TEST_FILE}"
          git diff --exit-code
          cp "${RUNNER_TEMP}/proof/cli-turn.test.ts" "${CLI_PROOF_FILE}"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/proof/cli-after-wall.txt" node scripts/run-vitest.mjs "${CLI_PROOF_FILE}" --reporter=verbose > "${RUNNER_TEMP}/proof/cli-after.log" 2>&1
          cat "${RUNNER_TEMP}/proof/cli-after.log"
          grep -q '3 passed' "${RUNNER_TEMP}/proof/cli-after.log"
          grep -q 'CLI_TURN_NARRATION_RECEIPT' "${RUNNER_TEMP}/proof/cli-after.log"
          git restore --source=HEAD --worktree -- "${CLI_PROOF_FILE}"
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/proof/final-source.txt"
      - name: Retain actual outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-failure-narration-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          retention-days: 30
