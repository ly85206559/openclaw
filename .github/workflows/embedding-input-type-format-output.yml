name: Embedding input type canonical format output

on:
  push:
    branches: [codex/embedding-input-type-format-output-20261101]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format-output:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ly85206559/openclaw
          ref: a3534d43aa38dfaf24c8d60baa9f549cb4d686d1
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Install pinned source
        working-directory: source
        run: |
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = a3534d43aa38dfaf24c8d60baa9f549cb4d686d1
          pnpm install --frozen-lockfile 2>&1 | tee ../artifacts/install.log
          test -z "$(git status --porcelain)"
      - name: Produce canonical helper formatting only
        working-directory: source
        run: |
          cp src/cli/capability-cli.embedding.test-support.ts ../artifacts/helper.original.ts
          pnpm format -- src/cli/capability-cli.embedding.test-support.ts 2>&1 | tee ../artifacts/formatter.log
          cp src/cli/capability-cli.embedding.test-support.ts ../artifacts/capability-cli.embedding.test-support.ts
          git diff --no-ext-diff --no-textconv --binary > ../artifacts/format.patch
          git rev-parse HEAD > ../artifacts/source-head.txt
          git status --porcelain > ../artifacts/source-status.txt
          git diff --numstat > ../artifacts/format-numstat.txt
      - name: Verify scope and count exact newline bytes
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs/promises';
          const helper = 'src/cli/capability-cli.embedding.test-support.ts';
          const head = 'a3534d43aa38dfaf24c8d60baa9f549cb4d686d1';
          const base = '39629c6aa82ce444f14c37fc1d4d47e5c7f661d0';
          const git = (...args) => execFileSync('git', args, { timeout: 10000 });
          assert.equal(git('rev-parse', 'HEAD').toString().trim(), head);
          assert.deepEqual(git('diff', '--name-only', 'HEAD').toString().trim().split('\n'), [helper]);
          assert.equal(git('status', '--porcelain').toString(), ` M ${helper}\n`);
          const original = await fs.readFile('../artifacts/helper.original.ts');
          const current = await fs.readFile(helper);
          const baseline = git('show', `${base}:${helper}`);
          assert(original.equals(git('show', `${head}:${helper}`)));
          assert(current.equals(await fs.readFile('../artifacts/capability-cli.embedding.test-support.ts')));
          const newlineCount = (bytes) => bytes.reduce((total, value) => total + Number(value === 10), 0);
          const counts = {
            head, base, helper,
            baselineNewlines: newlineCount(baseline),
            originalNewlines: newlineCount(original),
            formattedNewlines: newlineCount(current),
            formatterDelta: newlineCount(current) - newlineCount(original),
            netTestLinesVsBase: newlineCount(current) - newlineCount(baseline),
            onlyHelperChanged: true,
            productionDocsAndSdkUnchanged: true,
            diagnosticOnly: true,
          };
          await fs.writeFile('../artifacts/newline-counts.json', JSON.stringify(counts, null, 2) + '\n');
          console.log(JSON.stringify(counts));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: embedding-input-type-canonical-format-output
          path: artifacts
          if-no-files-found: error
          retention-days: 14
