name: Native audio exact-head refresh proof

on:
  push:
    branches: [codex/proof-queue-closeout-20261004]
    paths:
      - .github/workflows/proof-native-audio-refresh.yml
      - .github/proof/pr-155850-native-runtime.mts

permissions:
  contents: read

jobs:
  native-audio-proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      SOURCE_SHA: 4b19c5456d35bea91936f2ec591b941bcc25b15b
      BASE_SHA: 4d2617d425ab247a2f55a18523da8cc6a483746c
      FIRST_PARENT: 40bb3af996a66e2497efae63ea30d021235d3e08
      SOURCE_TREE: 3010af55d5dc0795485a92ddcf16c8149ef09468
      HARNESS_BLOB: 402516da203ea79effe271498394a959635937fd
      OPENCLAW_VITEST_MAX_WORKERS: "1"
      OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
    steps:
      - name: Prepare isolated container tooling
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y ca-certificates git ripgrep curl xz-utils libatomic1 python3 python3-venv time
      - name: Check out the pinned product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 3
      - name: Check out the same workflow commit's proof harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .artifacts/proof-input
          sparse-checkout: /.github/proof/pr-155850-native-runtime.mts
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1
      - name: Assert source, merge, diff, and original harness identity
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git config --global --add safe.directory "$PWD/.artifacts/proof-input"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$FIRST_PARENT $BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          printf '%s\n' src/meeting-bot/realtime-local-audio-transport.test.ts src/meeting-bot/realtime-local-audio-transport.ts src/meeting-bot/realtime-output-owner.test.ts src/meeting-bot/realtime-output-owner.ts > "$RUNNER_TEMP/expected-paths"
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git diff --quiet
          git diff --cached --quiet
          git check-ignore -q .artifacts/proof-input
          test "$(git -C .artifacts/proof-input rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .artifacts/proof-input rev-parse HEAD:.github/proof/pr-155850-native-runtime.mts)" = "$HARNESS_BLOB"
          test "$(git hash-object .artifacts/proof-input/.github/proof/pr-155850-native-runtime.mts)" = "$HARNESS_BLOB"
          git -C .artifacts/proof-input diff --exit-code
          git show --no-patch --format='%H %P %T %s' HEAD
          git diff --stat "$BASE_SHA"...HEAD
      - name: Install the selected Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Install the source-declared pnpm version
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Verify source toolchain pins
        run: |
          set -euo pipefail
          npm install --global corepack@0.36.0
          expected_pnpm="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.match(/^pnpm@([^+]+)/)[1]')"
          test "$(pnpm --version)" = "$expected_pnpm"
          test "$(corepack pnpm --version)" = "$expected_pnpm"
          node -p 'JSON.stringify({node:process.version,platform:process.platform,packageManager:JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager,engines:JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).engines})'
      - name: Install frozen dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint on the four changed files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          changed_paths=(src/meeting-bot/realtime-local-audio-transport.test.ts src/meeting-bot/realtime-local-audio-transport.ts src/meeting-bot/realtime-output-owner.test.ts src/meeting-bot/realtime-output-owner.ts)
          pnpm exec oxfmt --check "${changed_paths[@]}"
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json "${changed_paths[@]}"
          git diff --check "$BASE_SHA"...HEAD
      - name: Run four focused source and merge-neighbor suites without retries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tests=(
            src/meeting-bot/realtime-local-audio-transport.test.ts
            src/meeting-bot/realtime-output-owner.test.ts
            src/gateway/server.sessions.abort-authorization.test.ts
            src/gateway/server-methods/sessions-mutations.catalog-queue.test.ts
          )
          for test_file in "${tests[@]}"; do
            report="$RUNNER_TEMP/$(basename "$test_file").json"
            printf 'SOURCE_SHA=%s command=node scripts/run-vitest.mjs %s --maxWorkers=1 --retry=0\n' "$SOURCE_SHA" "$test_file"
            /usr/bin/time -f 'focused_suite wall_seconds=%e max_rss_kb=%M' node scripts/run-vitest.mjs "$test_file" --maxWorkers=1 --retry=0 --reporter=default --reporter=json --outputFile="$report"
            node --input-type=module - "$report" "$test_file" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.success, true);
          assert.ok(report.numTotalTests > 0, 'focused suite must collect tests');
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPassedTests, report.numTotalTests);
          assert.equal(report.numPendingTests ?? 0, 0);
          assert.equal(report.numTodoTests ?? 0, 0);
          assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0);
          assert.ok(report.testResults.length > 0);
          for (const file of report.testResults) {
            assert.equal(file.status, 'passed');
            assert.ok(file.assertionResults.length > 0);
            for (const test of file.assertionResults) assert.equal(test.status, 'passed');
          }
          console.log(JSON.stringify({file: process.argv[3], total: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests, skipped: report.numPendingTests ?? 0}));
          NODE
          done
      - name: Prove baseline clock defects and candidate fixes through real native child processes
        run: |
          set -euo pipefail
          harness="$PWD/.artifacts/proof-input/.github/proof/pr-155850-native-runtime.mts"
          runtime_harness="$PWD/.proof-runtime.mts"
          test "$(git hash-object "$harness")" = "$HARNESS_BLOB"
          test ! -e "$runtime_harness"
          cp -- "$harness" "$runtime_harness"
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$(git hash-object "$runtime_harness")" = "$HARNESS_BLOB" ]; then
              rm -- "$runtime_harness" || result=1
            else
              result=1
            fi
            git checkout --detach "$SOURCE_SHA" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          for case_name in baseline candidate; do
            if [ "$case_name" = baseline ]; then
              selected_sha="$BASE_SHA"
              expect_fixed=0
              printf 'BASELINE: exit 0 requires reproducing both original clock defects with negative controls passing; this is not fixed-product success.\n'
            else
              selected_sha="$SOURCE_SHA"
              expect_fixed=1
            fi
            git diff --quiet
            git diff --cached --quiet
            git checkout --detach "$selected_sha"
            test "$(git rev-parse HEAD)" = "$selected_sha"
            test "$(git hash-object "$runtime_harness")" = "$HARNESS_BLOB"
            report="$RUNNER_TEMP/native-audio-$case_name.json"
            test ! -e "$report"
            printf 'case=%s source=%s expect_fixed=%s command=node --import ./scripts/tsx.mjs .proof-runtime.mts\n' "$case_name" "$selected_sha" "$expect_fixed"
            PROOF_EXACT_SHA="$selected_sha" PROOF_EXPECT_FIXED="$expect_fixed" PROOF_OUTPUT="$report" \
              /usr/bin/time -f 'native_runtime_proof wall_seconds=%e max_rss_kb=%M' node --import ./scripts/tsx.mjs "$runtime_harness"
            node --input-type=module - "$report" "$selected_sha" "$expect_fixed" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(report.pr, 155850);
          assert.equal(report.exactSha, process.argv[3]);
          assert.equal(report.expectFixed, process.argv[4] === '1');
          assert.equal(report.platform, 'linux');
          assert.equal(report.status, 'passed');
          assert.deepEqual(report.cases.map(row => row.shiftMs), [60000, -60000]);
          for (const row of report.cases) {
            assert.equal(row.expectedOutcomeObserved, true);
            assert.equal(row.inputBytes, 960);
            assert.equal(row.sinkBytes, 57600);
            assert.equal(row.bargeSource.emissions, 3);
            assert.equal(row.bargeSource.emittedBytes, 2880);
            assert.deepEqual(row.warnings, []);
            assert.deepEqual(row.failures, []);
            assert.deepEqual(row.children.map(child => child.role), ['input', 'output', 'barge']);
            for (const child of row.children) {
              assert.equal(child.exited, true);
              assert.equal(child.exitRecord.stoppedBy, 'SIGTERM');
            }
          }
          console.log(JSON.stringify({source: report.exactSha, expectFixed: report.expectFixed, status: report.status, cases: report.cases.length, durationMs: report.durationMs, limitations: report.limitations}));
          NODE
            git diff --quiet
            git diff --cached --quiet
          done
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Run the complete changed-surface gate at the exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -e .proof-runtime.mts
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          node scripts/check-changed.mjs --base "$BASE_SHA" --dry-run
          /usr/bin/time -f 'changed_gate wall_seconds=%e max_rss_kb=%M' node scripts/check-changed.mjs --base "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
      - name: Verify final source and proof identity
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$FIRST_PARENT $BASE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e .proof-runtime.mts
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git -C .artifacts/proof-input rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object .artifacts/proof-input/.github/proof/pr-155850-native-runtime.mts)" = "$HARNESS_BLOB"
          git -C .artifacts/proof-input diff --exit-code
          printf 'SOURCE_SHA=%s BASE_SHA=%s HARNESS_BLOB=%s tracked_source_clean=true\n' "$SOURCE_SHA" "$BASE_SHA" "$HARNESS_BLOB"
