name: Diffs patch missing static checks

on:
  push:
    branches: [codex/discovery-feature-source-20261023]

permissions:
  contents: read

env:
  SOURCE_HEAD: 5592b707401fae530c29549a330fb3e391f06b99
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Prepare fresh exact source without starting the Gateway
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          pnpm install --frozen-lockfile
      - name: Run only the missing scoped typecheck and typed lint
        working-directory: source
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee ../artifacts/source-head.txt
          bash scripts/ci-collect-checks.sh \
            'node scripts/run-tsgo.mjs -p ../controller/proof/diffs-types.json' \
            'node scripts/run-oxlint.mjs --tsconfig extensions/tsconfig.json extensions/diffs/src/tool.ts extensions/diffs/src/tool.test.ts' \
            'git diff --check && test -z "$(git status --porcelain --untracked-files=no)"' \
            2>&1 | tee ../artifacts/static-checks.log
      - name: Preserve original checker output including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffs-patch-static-checks
          path: artifacts
          if-no-files-found: error
          retention-days: 14
