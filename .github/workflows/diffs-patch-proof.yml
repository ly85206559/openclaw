name: Diffs patch boundary proof

on:
  push:
    branches: [codex/discovery-feature-source-20261023]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: a6c561f954c41209124f7add70a13c59e883eda3
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Prepare exact source with canonical tools
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          pnpm install --frozen-lockfile
          pnpm --silent openclaw --version
          pnpm docs:list > ../controller-docs-list.txt
      - name: Actual Gateway tool and viewer readback (baseline failure expected)
        run: node controller/proof/diffs-patch-proof.mjs source artifacts
      - name: Preserve sanitized evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffs-patch-baseline
          path: artifacts
          if-no-files-found: error
          retention-days: 14
