name: PR 146956 focused launcher proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run runtime recovery shutdown regression
        run: >-
          node scripts/run-vitest.mjs run
          src/infra/node-runtime-recovery.test.ts
          -t "leaves foreground Gateway shutdown inside its drain budget"
      - name: Run packaged launcher shutdown regression
        run: >-
          timeout 600s node scripts/run-vitest.mjs run
          test/openclaw-launcher.e2e.test.ts
          -t "preserves foreground Gateway shutdown grace with packaged compile cache"
          --reporter verbose
      - name: Check patch whitespace
        run: git diff --check ${{ inputs.target_sha }}^ ${{ inputs.target_sha }}
