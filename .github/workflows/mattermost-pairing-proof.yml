name: Secretless Mattermost pairing boundary proof
on:
  push:
    branches: [codex/proof-mattermost-pairing-20261020]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, fixed]
    env:
      CI: "true"
      OPENCLAW_TEST_RUNTIME: node
      OPENCLAW_FORMAT_TOOL: oxfmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve external proof
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mattermost-proof"
          cp proof/mattermost-proof.test.ts "$RUNNER_TEMP/mattermost-proof/driver.test.ts"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: efe08fe5e5b82df59ba1c5f009a44d7e5282e2ca
          persist-credentials: false
          fetch-depth: 3
      - name: Pin owner input and install external proof
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = efe08fe5e5b82df59ba1c5f009a44d7e5282e2ca
          git diff e12719836f8e1f8b835496928d95ad847e453333 -- extensions/mattermost/src/mattermost/slash-http.ts extensions/mattermost/src/mattermost/slash-http.boundary.test.ts > "$RUNNER_TEMP/mattermost-proof/product.diff"
          if [ "$PHASE" = baseline ]; then
            git checkout e12719836f8e1f8b835496928d95ad847e453333 -- extensions/mattermost/src/mattermost/slash-http.ts
          fi
          git hash-object extensions/mattermost/src/mattermost/slash-http.ts extensions/mattermost/src/mattermost/slash-http.boundary.test.ts > "$RUNNER_TEMP/mattermost-proof/input-blobs.txt"
          cp "$RUNNER_TEMP/mattermost-proof/driver.test.ts" extensions/mattermost/src/mattermost/slash-pairing-runtime.proof.test.ts
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - uses: ./.github/actions/setup-ripgrep
      - name: Real registered HTTP callback and SQLite pairing store
        env:
          MATTERMOST_PROOF_PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          export PROOF_OUTPUT_DIR="$RUNNER_TEMP/mattermost-proof"
          pnpm test extensions/mattermost/src/mattermost/slash-pairing-runtime.proof.test.ts --maxWorkers=1 --reporter=json --outputFile="$PROOF_OUTPUT_DIR/runtime-tests.json" 2>&1 | tee "$PROOF_OUTPUT_DIR/runtime.log"
          node --input-type=module - "$PROOF_OUTPUT_DIR" "$MATTERMOST_PROOF_PHASE" <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [dir, phase] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(path.join(dir, 'runtime-tests.json'), 'utf8'));
          assert.equal(r.success, true);
          assert.equal(r.numTotalTests, 1);
          assert.equal(r.numPassedTests, 1);
          assert.equal(r.numFailedTests, 0);
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.testResults.length, 1);
          assert.equal(r.testResults[0].status, 'passed');
          const proof = JSON.parse(fs.readFileSync(path.join(dir, `mattermost-${phase}.json`), 'utf8'));
          assert.equal(proof.phase, phase);
          assert.equal(proof.completed, true);
          assert.equal(proof.cleanedUp, true);
          assert.equal(proof.productBehaviorPassed, phase === 'fixed');
          assert.equal(proof.baselineBugObserved, phase === 'baseline');
          assert.equal(proof.dispatchCalls, 0);
          assert.deepEqual(proof.errors, []);
          assert.equal(proof.responses.length, 5);
          JS
      - name: Regression and HTTP token-validation siblings
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          rm -- extensions/mattermost/src/mattermost/slash-pairing-runtime.proof.test.ts
          set +e
          pnpm test extensions/mattermost/src/mattermost/slash-http.boundary.test.ts extensions/mattermost/src/mattermost/slash-http.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/mattermost-proof/tests.json" > "$RUNNER_TEMP/mattermost-proof/tests.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/mattermost-proof/tests.log"
          node --input-type=module - "$RUNNER_TEMP/mattermost-proof/tests.json" "$PHASE" "$result" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const [file, phase, exit] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.testResults.length, 2);
          const owner = r.testResults.find(s => s.name.endsWith('/mattermost/slash-http.boundary.test.ts'));
          const sibling = r.testResults.find(s => s.name.endsWith('/mattermost/slash-http.test.ts'));
          assert.ok(owner);
          assert.ok(sibling);
          assert.equal(owner.assertionResults.length, 9);
          assert.equal(sibling.assertionResults.length, 10);
          assert.equal(sibling.status, 'passed');
          assert.equal(r.numTotalTests, 19);
          const failures = r.testResults.flatMap(s => s.assertionResults).filter(t => t.status === 'failed');
          for (const s of r.testResults) {
            assert.ok(s.assertionResults.every(t => t.status === 'passed' || t.status === 'failed'));
          }
          if (phase === 'baseline') {
            assert.notEqual(Number(exit), 0);
            assert.equal(owner.status, 'failed');
            assert.equal(r.numFailedTests, 1);
            assert.equal(r.numPassedTests, 18);
            assert.equal(failures.length, 1);
            assert.match(failures[0].fullName, /answers a pairing declined request without dispatching the command/);
            assert.match(failures[0].failureMessages.join('\n'), /Unauthorized/);
          } else {
            assert.equal(Number(exit), 0);
            assert.equal(owner.status, 'passed');
            assert.equal(r.numPassedTests, 19);
            assert.equal(r.numFailedTests, 0);
            assert.equal(r.success, true);
          }
          console.log(JSON.stringify({phase, passed:r.numPassedTests, failed:r.numFailedTests}));
          JS
      - name: Official changed-file checks
        if: matrix.phase == 'fixed'
        run: |
          set -euo pipefail
          pnpm check:changed --base e12719836f8e1f8b835496928d95ad847e453333 2>&1 | tee "$RUNNER_TEMP/mattermost-proof/checks.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mattermost-pairing-${{ matrix.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mattermost-proof
          if-no-files-found: error
          retention-days: 30
