name: Emoji IME native baseline
on:
  push:
    branches: [codex/proof-emoji-ime-20261109]
permissions:
  contents: read
env:
  SOURCE_SHA: e530455b80498c0fa927bed2e2168ea7f5475786
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
          sparse-checkout: .github/pr-proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: e530455b80498c0fa927bed2e2168ea7f5475786
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.2
          cache-mode: off
      - name: Install frozen source and native Chromium
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > ../artifacts/source-sha.txt
          node --version > ../artifacts/node-version.txt
          pnpm install --frozen-lockfile > ../artifacts/install.log 2>&1
          cp ui/node_modules/solid-js/CHEATSHEET.md ../artifacts/solid-CHEATSHEET.md
          pnpm --dir ui exec playwright install --with-deps chromium > ../artifacts/browser-install.log 2>&1
          pnpm docs:list > ../artifacts/docs-list.log 2>&1
      - name: Build actual Gateway and production UI
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:runtime > ../artifacts/build-runtime.log 2>&1
          pnpm ui:build > ../artifacts/build-ui.log 2>&1
      - name: Probe native IME input through the actual agent emoji picker
        run: node controller/.github/pr-proof/emoji-ime-20261109.mjs source artifacts
      - name: Verify tracked source remains unchanged
        if: always()
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          git status --porcelain --untracked-files=no > ../artifacts/source-status-after.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -s ../artifacts/source-status-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: emoji-ime-native-baseline
          path: artifacts
          retention-days: 14
          if-no-files-found: error
