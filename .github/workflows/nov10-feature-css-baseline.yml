name: Nov 10 feature scaffold CSS baseline

on:
  push:
    branches: [codex/discovery-proof-20261110]
    paths:
      - .github/workflows/nov10-feature-css-baseline.yml
      - proof/nov10-feature-css-baseline.mjs
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 40c3b508ba130cb9244f077015321b4fa4e91965
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Frozen source dependencies
        working-directory: source
        run: |
          mkdir -p ../artifacts
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/install.wall.txt pnpm install --frozen-lockfile 2>&1 | tee ../artifacts/install.log
      - name: Prepare the canonical CLI
        working-directory: source
        run: |
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/cli-prepare.wall.txt pnpm --silent openclaw --version 2>&1 | tee ../artifacts/cli-prepare.log
      - name: Actual generated project first build
        working-directory: source
        run: |
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/baseline.wall.txt node --import ./scripts/tsx.mjs ../controller/proof/nov10-feature-css-baseline.mjs . ../artifacts 2>&1 | tee ../artifacts/baseline.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nov10-feature-css-baseline
          path: artifacts
          if-no-files-found: error
          retention-days: 14
