name: Secretless image resolution original CLI proof

on:
  push:
    branches: [codex/proof-image-cli-resolution-20261013]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-cli:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 03512be2f3df16d4ec861ed1bebeaa967c30da2d
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze original product and supported CLI proof script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/image-resolution"
          cp .github/proof/image-resolution-cli.mjs "${RUNNER_TEMP}/image-resolution/cli.mjs"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/image-resolution/baseline-source.txt"
          sha256sum src/cli/capability-cli/image.ts "${RUNNER_TEMP}/image-resolution/cli.mjs" | tee "${RUNNER_TEMP}/image-resolution/executed-sha256.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: true
          cache-mode: off
      - name: Canonical build for the actual supported CLI
        run: pnpm build > "${RUNNER_TEMP}/image-resolution/build.log" 2>&1
      - name: Actual supported CLI reaches model validation for invalid resolution
        env:
          PROOF_MODE: baseline
        run: node "${RUNNER_TEMP}/image-resolution/cli.mjs" > "${RUNNER_TEMP}/image-resolution/cli.log" 2>&1
      - name: Retain raw receipts even on setup or fixture failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-resolution-original-cli-${{ github.run_id }}
          path: ${{ runner.temp }}/image-resolution
          retention-days: 30
