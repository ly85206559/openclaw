name: PR 99556 Nested UI Proof

on:
  push:
    branches:
      - codex/proof-pr-99556-nested-ui

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify exact PR source plus proof-only files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 97bb40177d96e78751827286a17012c20a387326)" = "97bb40177d96e78751827286a17012c20a387326"
          test "$(git diff --name-only 97bb40177d96e78751827286a17012c20a387326...HEAD | sort | tr '\n' ' ')" = ".github/workflows/pr-99556-nested-ui-proof.yml ui/src/e2e/chat-history-nested-inline-image-proof.e2e.test.ts "

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Install pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.1.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Capture exact-head nested history proof
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "1"
        run: >-
          node scripts/run-vitest.mjs run
          --config test/vitest/vitest.ui-e2e.config.ts
          --configLoader runner
          ui/src/e2e/chat-history-nested-inline-image-proof.e2e.test.ts

      - name: List proof artifacts
        if: always()
        run: find .artifacts/control-ui-e2e/pr-99556-nested-history -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-99556-nested-ui-proof-${{ github.run_id }}
          path: .artifacts/control-ui-e2e/pr-99556-nested-history
          if-no-files-found: error
          retention-days: 14
