name: Channel logs follow baseline

on:
  push:
    branches: [codex/channels-logs-proof-20261023]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 53f8d4f7f577aff93ca625c210185145a90ad81a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Prepare unchanged baseline source
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '53f8d4f7f577aff93ca625c210185145a90ad81a'
          pnpm install --frozen-lockfile
          pnpm docs:list > ../docs-list.txt
      - name: Observe supported CLI rejection before implementation
        run: node controller/proof/channels-logs-baseline.mjs source artifacts
      - name: Preserve actual CLI evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-logs-follow-baseline
          path: artifacts
          if-no-files-found: error
          retention-days: 14
