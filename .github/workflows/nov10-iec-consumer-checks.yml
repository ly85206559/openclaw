name: Nov 10 IEC direct parser consumer checks

on:
  push:
    branches: [codex/discovery-proof-20261110]
    paths:
      - .github/workflows/nov10-iec-consumer-checks.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  direct-parser:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ly85206559/openclaw
          ref: 097e41e68deaf51e11c3a57b4df811d8d3b7acd1
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Install exact source
        working-directory: source
        run: |
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = 097e41e68deaf51e11c3a57b4df811d8d3b7acd1
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/install.wall.txt pnpm install --frozen-lockfile 2>&1 | tee ../artifacts/install.log
      - name: Existing direct parser throw and rounding contracts
        working-directory: source
        run: |
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/consumer-tests.wall.txt pnpm test src/cli/cli-utils.test.ts --maxWorkers=1 --reporter=default --reporter=junit --outputFile.junit="$GITHUB_WORKSPACE/artifacts/consumer-tests.xml" 2>&1 | tee ../artifacts/consumer-tests.log
      - name: Record exact source and tracked cleanliness
        if: always()
        working-directory: source
        run: |
          git rev-parse HEAD > ../artifacts/source-head.txt
          git status --porcelain --untracked-files=no > ../artifacts/source-status.txt
          test "$(git rev-parse HEAD)" = 097e41e68deaf51e11c3a57b4df811d8d3b7acd1
          test ! -s ../artifacts/source-status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nov10-iec-direct-parser-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
