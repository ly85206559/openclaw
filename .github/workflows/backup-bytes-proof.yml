name: Attribute backup proof failed gates
on:
  push:
    branches: [codex/proof-backup-bytes-20261020]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      OPENCLAW_TEST_RUNTIME: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2ad0499e0f71deb6817ec0e4036c89c86c53800d
          persist-credentials: false
          fetch-depth: 2
      - name: Select unchanged original baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-attribution"
          git checkout --detach e12719836f8e1f8b835496928d95ad847e453333
          git rev-parse HEAD > "$RUNNER_TEMP/backup-attribution/base.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - uses: ./.github/actions/setup-ripgrep
      - name: Independently inspect all three original-baseline Knip scans
        run: |
          set -euo pipefail
          set +e
          pnpm deadcode:exports > "$RUNNER_TEMP/backup-attribution/base-knip.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/backup-attribution/base-knip.log"
          node --input-type=module - "$RUNNER_TEMP/backup-attribution/base-knip.log" "$result" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const [file, exit] = process.argv.slice(2);
          const log = fs.readFileSync(file, 'utf8');
          assert.equal(Number(exit), 1, 'retain baseline checker failure, never call it green');
          const entries = [...log.matchAll(/^  (\S+): ([^\r\n]+)$/gm)].map(m => m[1] + ': ' + m[2]).sort();
          assert.deepEqual(entries, [
            'src/agents/tool-search-catalog.ts: UNRETRIEVABLE_INSTRUCTIONS_HINT',
            'ui/src/pages/sessions/view.test-support.tsx: disposeSessionView',
          ]);
          assert.match(log, /production unused-export scan:/);
          assert.match(log, /full-tree unused-export scan:/);
          assert.match(log, /script unused-export scan passed with 0 entries/);
          assert.doesNotMatch(log, /could not resolve|failed:|no export sections|ERROR: Error loading/);
          console.log('Original baseline independently reproduces both exact export findings; checker remains FAILURE.');
          JS
      - name: Repair only the missing-tool fixture for the original failed ratchet
        run: |
          set -euo pipefail
          git checkout --detach 2ad0499e0f71deb6817ec0e4036c89c86c53800d
          test "$(git rev-parse HEAD)" = 2ad0499e0f71deb6817ec0e4036c89c86c53800d
          pnpm check:database-worker-ratchet --base e12719836f8e1f8b835496928d95ad847e453333 2>&1 | tee "$RUNNER_TEMP/backup-attribution/worker-ratchet.log"
          git diff e12719836f8e1f8b835496928d95ad847e453333 -- src/agents/tool-search-catalog.ts ui/src/pages/sessions/view.test-support.tsx > "$RUNNER_TEMP/backup-attribution/unrelated-files.diff"
          test ! -s "$RUNNER_TEMP/backup-attribution/unrelated-files.diff"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backup-failed-gates-attribution-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-attribution
          if-no-files-found: error
          retention-days: 30
