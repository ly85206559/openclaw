name: Secretless backup byte-count proof
on:
  push:
    branches: [codex/proof-backup-bytes-20261020]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, fixed]
    env:
      CI: "true"
      OPENCLAW_TEST_RUNTIME: node
      OPENCLAW_FORMAT_TOOL: oxfmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin product input
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-proof"
          cp proof/backup-bytes.mjs "$RUNNER_TEMP/backup-proof/driver.mjs"
          git checkout --detach 2ad0499e0f71deb6817ec0e4036c89c86c53800d
          git diff e12719836f8e1f8b835496928d95ad847e453333 -- src/commands/backup-record.ts src/commands/backup-outcome.test.ts > "$RUNNER_TEMP/backup-proof/product.diff"
          if [ "$PHASE" = baseline ]; then
            git checkout e12719836f8e1f8b835496928d95ad847e453333 -- src/commands/backup-record.ts
          fi
          git hash-object src/commands/backup-record.ts src/commands/backup-outcome.test.ts > "$RUNNER_TEMP/backup-proof/input-blobs.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - name: Actual supported CLI baseline or fixed controls
        env:
          PHASE: ${{ matrix.phase }}
        run: node "$RUNNER_TEMP/backup-proof/driver.mjs"
      - name: Offline ledger regression and registered route siblings
        env:
          PHASE: ${{ matrix.phase }}
        run: |
          set -euo pipefail
          set +e
          pnpm test src/commands/backup-outcome.test.ts src/cli/program/register.backup.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/backup-proof/tests.json" > "$RUNNER_TEMP/backup-proof/tests.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/backup-proof/tests.log"
          node --input-type=module - "$RUNNER_TEMP/backup-proof/tests.json" "$PHASE" "$result" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const [file, phase, exit] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.testResults.length, 2);
          const owner = r.testResults.find(s => s.name.endsWith('/src/commands/backup-outcome.test.ts'));
          const sibling = r.testResults.find(s => s.name.endsWith('/src/cli/program/register.backup.test.ts'));
          assert.ok(owner);
          assert.ok(sibling);
          assert.equal(owner.assertionResults.length, 7);
          assert.equal(sibling.assertionResults.length, 10);
          assert.equal(sibling.status, 'passed');
          for (const s of r.testResults) {
            assert.ok(s.assertionResults.every(t => t.status === 'passed' || t.status === 'failed'));
          }
          const failures = r.testResults.flatMap(s => s.assertionResults).filter(t => t.status === 'failed');
          if (phase === 'baseline') {
            assert.notEqual(Number(exit), 0);
            assert.equal(owner.status, 'failed');
            assert.equal(r.numTotalTests, 17);
            assert.equal(r.numPassedTests, 16);
            assert.equal(r.numFailedTests, 1);
            assert.equal(failures.length, 1);
            assert.match(failures[0].fullName, /rejects non-decimal byte counts without appending an outcome/);
            assert.match(failures[0].failureMessages.join('\n'), /promise resolved|reject/i);
          } else {
            assert.equal(Number(exit), 0);
            assert.equal(owner.status, 'passed');
            assert.equal(r.numFailedTests, 0);
            assert.equal(r.success, true);
          }
          console.log(JSON.stringify({phase, total:r.numTotalTests, passed:r.numPassedTests, failed:r.numFailedTests}));
          JS
      - name: Targeted official changed checks
        if: matrix.phase == 'fixed'
        run: |
          set -euo pipefail
          pnpm check:changed --base e12719836f8e1f8b835496928d95ad847e453333 2>&1 | tee "$RUNNER_TEMP/backup-proof/checks.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: backup-bytes-${{ matrix.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/backup-proof
          if-no-files-found: error
          retention-days: 30
