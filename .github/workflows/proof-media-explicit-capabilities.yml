name: Explicit media capabilities proof

on:
  push:
    branches: [codex/proof-media-explicit-capabilities]
    paths: [".github/workflows/proof-media-explicit-capabilities.yml"]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 1bc8f9d62ffccb24baa4756694ae3198967dc839
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Install check tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
      - name: Install locked baseline dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify existing plugin-boundary blocker on untouched base
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const result = spawnSync('node', ['--import', './scripts/tsx.mjs', 'scripts/plugin-boundary-report.ts', '--summary', '--fail-on-eligible-compat'], { encoding: 'utf8', maxBuffer: 4 * 1024 * 1024 });
          console.log(result.stdout);
          console.log(result.stderr);
          console.log(JSON.stringify({ source: process.env.SOURCE_SHA, status: result.status }));
          assert.equal(result.status, 1);
          assert.match(result.stdout + result.stderr, /plugin-boundary-report: 11 compatibility record\(s\) are due for removal/);
          assert.match(result.stdout + result.stderr, /compat deprecated=22 eligibleForRemoval=11 removalPending=4 removalPendingDue=3/);
          assert.doesNotMatch(result.stdout + result.stderr, /ERR_MODULE_NOT_FOUND|SyntaxError|Unhandled Rejection|Uncaught Exception/);
          NODE
  scoped-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 2e1eb0dd0a1a4f710cf3208b352d5f3422a3fe36
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Install check tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
      - name: Install locked dependencies in secretless checkout
        run: pnpm install --frozen-lockfile
      - name: Verify final source and targeted lint
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/media-understanding/apply.provider-registry-lazy.test.ts src/media-understanding/runner.ts
      - name: Core boundary check
        run: pnpm lint:tmp:tsgo-core-boundary
      - name: Core types
        run: pnpm tsgo:core
      - name: Core test types
        run: pnpm tsgo:core:test
