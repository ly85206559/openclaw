name: New Session IME confirmation proof

on:
  push:
    branches:
      - codex/proof-new-session-ime-screenshots-20261006

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
      - run: pnpm test ui/src/pages/new-session/composer.test.ts --maxWorkers=1
      - run: pnpm test:ui:e2e ui/src/e2e/new-session-page.transition.e2e.test.ts --maxWorkers=1 -t 'creates and lists a session with the default mock Gateway'
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: new-session-ime-screenshots
          path: '.artifacts/control-ui-e2e/**/new-session-transition/ime-*.png'
          include-hidden-files: true
          if-no-files-found: error
