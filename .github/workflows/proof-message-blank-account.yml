name: Proof message blank account

on:
  pull_request:
    branches:
      - proof/message-blank-account-cli-base

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "true"

      - name: Run focused parser regression
        run: pnpm test src/cli/program/message/helpers.test.ts
