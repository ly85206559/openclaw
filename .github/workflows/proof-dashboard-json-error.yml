name: Secretless dashboard JSON error boundary proof

on:
  push:
    branches: [codex/proof-dashboard-json-error-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 3666e847aac206c4f1a8805d97de96861c9c56ca
      TARGET_SHA: 3ed4cce149e2718ccab2339f4a3ee38f853e6d60
      TEST_FILE: src/commands/dashboard/json.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze the regression and both source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dashboard-proof"
          cp "${TEST_FILE}" "${RUNNER_TEMP}/dashboard-proof/frozen.test.ts"
          sha256sum "${RUNNER_TEMP}/dashboard-proof/frozen.test.ts" | tee "${RUNNER_TEMP}/dashboard-proof/fixture-sha256.txt"
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git fetch --depth=4 --no-tags https://github.com/ly85206559/openclaw.git "${TARGET_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - name: Install isolated pinned dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          { node --version; pnpm --version; } | tee "${RUNNER_TEMP}/dashboard-proof/toolchain.txt"
      - name: Baseline regression RED and unchanged success controls
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/dashboard-proof/frozen.test.ts" "${TEST_FILE}"
          cmp "${RUNNER_TEMP}/dashboard-proof/frozen.test.ts" "${TEST_FILE}"
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/dashboard-proof/red-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" --maxWorkers=1 --reporter=verbose > "${RUNNER_TEMP}/dashboard-proof/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/dashboard-proof/red.log"
          printf 'sha=%s\nexit=%s\n' "$(git rev-parse HEAD)" "${result}" | tee "${RUNNER_TEMP}/dashboard-proof/red-source.txt"
          test "${result}" = 1
          grep -q '5 failed' "${RUNNER_TEMP}/dashboard-proof/red.log"
          grep -q '4 passed' "${RUNNER_TEMP}/dashboard-proof/red.log"
          grep -q 'AssertionError' "${RUNNER_TEMP}/dashboard-proof/red.log"
          git restore -- "${TEST_FILE}"
          git diff --exit-code
      - name: Actual supported CLI baseline failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dashboard-proof/red-state"
          set +e
          OPENCLAW_STATE_DIR="${RUNNER_TEMP}/dashboard-proof/red-state" OPENCLAW_CONFIG_PATH="${RUNNER_TEMP}/dashboard-proof/red-state/openclaw.json" /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/dashboard-proof/red-cli-wall.txt" pnpm --silent openclaw dashboard --json > "${RUNNER_TEMP}/dashboard-proof/red-cli.json" 2> "${RUNNER_TEMP}/dashboard-proof/red-cli.stderr"
          result=$?
          set -e
          printf 'exit=%s\n' "${result}" | tee "${RUNNER_TEMP}/dashboard-proof/red-cli-exit.txt"
          test "${result}" = 1
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const value=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/dashboard-proof/red-cli.json","utf8")); assert.equal(value.ok,false); assert.equal(value.reason,"Gateway is not running."); assert.equal("error" in value,false); console.log("BASELINE_CLI",JSON.stringify(value));'
          git diff --exit-code
      - name: Exact candidate GREEN and owner siblings
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}"..HEAD)" = 2
          paths="$(git diff --name-only "${BASE_SHA}" HEAD | sort)"
          printf '%s\n' "${paths}" | tee "${RUNNER_TEMP}/dashboard-proof/candidate-scope.txt"
          test "${paths}" = "$(printf '%s\n' docs/cli/dashboard.md src/commands/dashboard.ts src/commands/dashboard/json.test.ts | sort)"
          cmp "${RUNNER_TEMP}/dashboard-proof/frozen.test.ts" "${TEST_FILE}"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/dashboard-proof/green-wall.txt" node scripts/run-vitest.mjs "${TEST_FILE}" src/commands/dashboard.test.ts src/commands/dashboard.links.test.ts src/cli/failure-output.test.ts --maxWorkers=1 --reporter=verbose > "${RUNNER_TEMP}/dashboard-proof/green.log" 2>&1
          cat "${RUNNER_TEMP}/dashboard-proof/green.log"
          pnpm exec oxfmt --check docs/cli/dashboard.md src/commands/dashboard.ts "${TEST_FILE}"
          node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json src/commands/dashboard.ts "${TEST_FILE}"
          git diff --check "${BASE_SHA}" HEAD
          git diff --exit-code
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/dashboard-proof/green-source.txt"
      - name: Actual supported CLI candidate and downstream JSON consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dashboard-proof/green-state"
          set +e
          OPENCLAW_STATE_DIR="${RUNNER_TEMP}/dashboard-proof/green-state" OPENCLAW_CONFIG_PATH="${RUNNER_TEMP}/dashboard-proof/green-state/openclaw.json" /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/dashboard-proof/green-cli-wall.txt" pnpm --silent openclaw dashboard --json > "${RUNNER_TEMP}/dashboard-proof/green-cli.json" 2> "${RUNNER_TEMP}/dashboard-proof/green-cli.stderr"
          result=$?
          set -e
          printf 'exit=%s\n' "${result}" | tee "${RUNNER_TEMP}/dashboard-proof/green-cli-exit.txt"
          test "${result}" = 1
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const value=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/dashboard-proof/green-cli.json","utf8")); assert.equal(value.ok,false); assert.equal(value.reason,"Gateway is not running."); assert.deepEqual(value.error,{type:"cli_error",message:value.reason}); console.log("CANDIDATE_CLI",JSON.stringify(value));'
          git diff --exit-code
      - name: Retain outcomes including startup failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dashboard-json-error-${{ github.run_id }}
          path: ${{ runner.temp }}/dashboard-proof
          retention-days: 30
