name: Secretless Tlon SSE baseline proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 03512be2f3df16d4ec861ed1bebeaa967c30da2d
      REGRESSION_SHA: 84166c0424028e2af314811e8db21ea2ea613013
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze reviewed tests and unchanged production owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tlon-sse"
          cp .github/proof/tlon-sse-audit-reporter.mjs "${RUNNER_TEMP}/tlon-sse/audit-reporter.mjs"
          git fetch --depth=1 --no-tags https://github.com/ly85206559/openclaw.git "${REGRESSION_SHA}"
          for file in sse-client.test.ts sse-client.connect-fail.transport.test.ts; do
            git show "${REGRESSION_SHA}:extensions/tlon/src/urbit/${file}" > "${RUNNER_TEMP}/tlon-sse/${file}"
          done
          git fetch --depth=1 --no-tags https://github.com/openclaw/openclaw.git "${BASE_SHA}"
          git checkout --detach "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          for file in sse-client.test.ts sse-client.connect-fail.transport.test.ts; do
            cp "${RUNNER_TEMP}/tlon-sse/${file}" "extensions/tlon/src/urbit/${file}"
          done
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/tlon-sse/baseline-source.txt"
          sha256sum extensions/tlon/src/urbit/sse-client.ts extensions/tlon/src/urbit/sse-client*.test.ts | tee "${RUNNER_TEMP}/tlon-sse/reviewed-sha256.txt"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install and format on the permitted stock runner
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          { node --version; pnpm --version; } | tee "${RUNNER_TEMP}/tlon-sse/toolchain.txt"
          pnpm exec oxfmt --write --threads=1 extensions/tlon/src/urbit/sse-client.test.ts extensions/tlon/src/urbit/sse-client.connect-fail.transport.test.ts
          cp extensions/tlon/src/urbit/sse-client*.test.ts "${RUNNER_TEMP}/tlon-sse/"
          sha256sum extensions/tlon/src/urbit/sse-client*.test.ts | tee "${RUNNER_TEMP}/tlon-sse/executed-fixture-sha256.txt"
      - name: Baseline original-order suites must fail only delivery assertions
        shell: bash
        env:
          PROOF_AUDIT_PATH: ${{ runner.temp }}/tlon-sse/runner-audit.json
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/tlon-sse/red-wall.txt" \
            node scripts/run-vitest.mjs extensions/tlon/src/urbit/sse-client.test.ts extensions/tlon/src/urbit/sse-client.connect-fail.transport.test.ts --maxWorkers=1 \
            --reporter=verbose --reporter=json --reporter="${RUNNER_TEMP}/tlon-sse/audit-reporter.mjs" --outputFile="${RUNNER_TEMP}/tlon-sse/red.json" \
            > "${RUNNER_TEMP}/tlon-sse/red.log" 2>&1
          result=$?
          set -e
          cat "${RUNNER_TEMP}/tlon-sse/red.log"
          printf 'exit=%s\n' "$result" | tee "${RUNNER_TEMP}/tlon-sse/red-exit.txt"
          test "$result" = 1
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tlon-sse/red.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync(process.env.PROOF_AUDIT_PATH, 'utf8'));
          assert.equal(report.success, false);
          assert.equal(report.numTotalTests, 32);
          assert.equal(report.numFailedTests, 7);
          assert.equal(report.numPassedTests, 25);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.testResults.length, 2);
          assert.equal(audit.reason, 'failed');
          assert.equal(audit.moduleCount, 2);
          assert.equal(audit.unhandledErrors, 0);
          assert.equal(audit.suiteErrors, 0);
          for (const file of report.testResults) assert.equal(file.message, '');
          const failed = report.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'failed');
          assert.deepEqual(failed.map(test => test.title).sort(), [
            'delivers multiline data over LF HTTP SSE framing',
            'delivers single data over CRLF HTTP SSE framing',
            'delivers multiline data over CRLF HTTP SSE framing',
            'delivers single data over CR HTTP SSE framing',
            'delivers multiline data over CR HTTP SSE framing',
            'preserves CRLF delimiters split across byte chunks',
            'preserves CR delimiters split across byte chunks',
          ].sort());
          for (const test of failed) assert.match(test.failureMessages.join('\n'), /AssertionError/);
          console.log('EXPECTED_BASELINE_RED', JSON.stringify({ tests:32, failed:7, controlsPassed:25, fixtureErrors:0 }));
          AUDIT
      - name: Retain raw receipts even on setup or fixture failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tlon-sse-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/tlon-sse
          retention-days: 30
