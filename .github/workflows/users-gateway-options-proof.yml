name: Users Gateway options proof

on:
  push:
    branches: [codex/users-gateway-options-proof-20261101]

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 39629c6aa82ce444f14c37fc1d4d47e5c7f661d0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Install pinned source
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Real CLI feature-absence diagnostic
        run: node controller/proof/users-gateway-options-baseline.mjs source artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: users-gateway-options-baseline
          path: artifacts
          if-no-files-found: error
          retention-days: 14
