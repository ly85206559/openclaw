name: Plugin bundle CLI refusal proof
on:
  push:
    branches: [codex/proof-plugin-bundle-errors-20261105]
permissions:
  contents: read
env:
  SOURCE_SHA: 491e537e524d8bf3b907c8a153526055002087f1
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: .github/pr-proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Pin and build the unchanged real CLI
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > ../artifacts/source-sha.txt
          pnpm install --frozen-lockfile > ../artifacts/install.log 2>&1
          pnpm build:runtime > ../artifacts/build.log 2>&1
      - name: Reproduce the specific owner failure through the CLI
        shell: bash
        run: node proof/.github/pr-proof/plugin-bundle-cli-20261105.mjs source artifacts
      - name: Verify source remains unchanged
        if: always()
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          git status --porcelain --untracked-files=no > ../artifacts/source-status-after.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -s ../artifacts/source-status-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plugin-bundle-cli-baseline
          path: artifacts
          retention-days: 14
          if-no-files-found: error
