name: Plugin bundle CLI refusal proof
on:
  push:
    branches: [codex/proof-plugin-bundle-errors-20261105]
permissions:
  contents: read
env:
  SOURCE_SHA: c33e143c2a58c233b6bc90dd7356814c4e997e0c
  SOURCE_BASE: de04fbe0caa9332999bdcc28d5d4e049672afb16
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: .github/pr-proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ly85206559/openclaw
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 3
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Pin source and install locked dependencies
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > ../artifacts/source-sha.txt
          pnpm install --frozen-lockfile > ../artifacts/install.log 2>&1
      - name: Owning browser-builder regression red and green
        working-directory: source
        shell: bash
        run: |
          owner=src/cli/plugins-build-bundle.ts
          trap 'git restore --source=HEAD -- src/cli/plugins-build-bundle.ts' EXIT
          git show "$SOURCE_BASE:$owner" > "$owner"
          set +e
          node scripts/run-vitest.mjs src/cli/plugins-control-ui-build.test.ts --maxWorkers=1 --testNamePattern 'requires author-installed compilers' --reporter=verbose --reporter=json --outputFile.json=../artifacts/unit-red.json > ../artifacts/unit-red.log 2>&1
          red_status=$?
          set -e
          printf '%s\n' "$red_status" > ../artifacts/unit-red-exit.txt
          test "$red_status" -ne 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('../artifacts/unit-red.json', 'utf8'));
          const failures = result.testResults.flatMap(file => file.assertionResults).filter(test => test.status === 'failed');
          if (result.numFailedTests !== 1 || result.numPassedTests || failures.length !== 1 || !failures[0].title.includes('requires author-installed compilers') || !fs.readFileSync('../artifacts/unit-red.log','utf8').includes('humanOutput')) throw new Error('Wrong regression baseline');
          NODE
          git restore --source=HEAD -- "$owner"
          node scripts/run-vitest.mjs src/cli/plugins-control-ui-build.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json=../artifacts/unit-green.json > ../artifacts/unit-green.log 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('../artifacts/unit-green.json', 'utf8'));
          if (!result.numPassedTests || result.numFailedTests || result.numPendingTests) throw new Error('Incomplete fixed owner tests');
          NODE
      - name: Build the frozen fixed CLI
        working-directory: source
        shell: bash
        run: |
          pnpm build:runtime > ../artifacts/build.log 2>&1
      - name: Verify the fixed real CLI and negative controls
        shell: bash
        run: node proof/.github/pr-proof/plugin-bundle-cli-20261105.mjs source artifacts fixed
      - name: Targeted types lint format and budget
        working-directory: source
        shell: bash
        run: |
          mkdir -p .artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('.artifacts/plugin-compiler-types.json', JSON.stringify({extends:'../tsconfig.json',compilerOptions:{incremental:true,tsBuildInfoFile:'./plugin-compiler-types.tsbuildinfo',noEmit:true},files:[],include:['../src/cli/plugins-build-bundle.ts','../src/cli/plugins-control-ui-build.test.ts']},null,2));
          NODE
          node scripts/run-tsgo.mjs -p .artifacts/plugin-compiler-types.json 2>&1 | tee ../artifacts/types.log
          node scripts/run-oxlint.mjs --tsconfig tsconfig.json src/cli/plugins-build-bundle.ts src/cli/plugins-control-ui-build.test.ts 2>&1 | tee ../artifacts/lint.log
          pnpm format:check --no-error-on-unmatched-pattern -- src/cli/plugins-build-bundle.ts src/cli/plugins-control-ui-build.test.ts 2>&1 | tee ../artifacts/format.log
          pnpm check:test-lines-ratchet --base "$SOURCE_BASE" 2>&1 | tee ../artifacts/budget.log
          git diff --check
      - name: Verify source remains unchanged
        if: always()
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          git status --porcelain --untracked-files=no > ../artifacts/source-status-after.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -s ../artifacts/source-status-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plugin-bundle-cli-fixed
          path: artifacts
          retention-days: 14
          if-no-files-found: error
