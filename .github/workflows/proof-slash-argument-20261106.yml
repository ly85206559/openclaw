name: Slash argument selection green proof
on:
  push:
    branches: [codex/proof-slash-argument-green-v3-20261106]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ly85206559/openclaw
          ref: 9a204c99c2608a299aea4d447527f4181bcbff1f
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Install pinned source and Chromium
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9a204c99c2608a299aea4d447527f4181bcbff1f
          test "$(git rev-parse HEAD^)" = f7a46e85d26ad28de5eba194a386731ed28a518f
          mkdir -p ../artifacts
          git diff --check HEAD^ HEAD
          pnpm install --frozen-lockfile
          pnpm --dir ui exec playwright install --with-deps chromium
      - name: Verify the baseline regression scenario
        working-directory: source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source = fs.readFileSync('ui/src/e2e/chat-thinking-arguments.e2e.test.ts', 'utf8');
          const snippet = fs.readFileSync('../controller/.github/proof/slash-argument-selection.ts', 'utf8').trim();
          const prefix = 'suite.define(() => {';
          const suffix = '\n});';
          assert.ok(snippet.startsWith(prefix) && snippet.endsWith(suffix));
          assert.ok(source.includes(snippet.slice(prefix.length, -suffix.length).trim()));
          NODE
      - name: Slash menu behavior and negative controls
        working-directory: source
        run: |
          set -euo pipefail
          pnpm --dir ui test src/pages/chat/components/chat-composer-menu.test.tsx 2>&1 | tee ../artifacts/slash-unit.log
      - name: Real pointer selection and existing desktop control
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner ui/src/e2e/chat-thinking-arguments.e2e.test.ts --testNamePattern 'keeps the selected thinking level after selecting text|opens the active model.*desktop' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json=../artifacts/slash-green.json 2>&1 | tee ../artifacts/slash-green.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('../artifacts/slash-green.json', 'utf8'));
          const tests = report.testResults.flatMap((file) => file.assertionResults);
          const passed = tests.filter((test) => test.status === 'passed');
          assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0);
          assert.equal(tests.filter((test) => test.status === 'failed').length, 0);
          assert.equal(passed.length, 2);
          assert.ok(passed.some((test) => /keeps the selected thinking level after selecting text/.test(test.fullName)));
          assert.ok(passed.some((test) => /opens the active model.*desktop/.test(test.fullName)));
          NODE
      - name: Touched-surface format and lint
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/run-format.mts --check ui/src/e2e/chat-thinking-arguments.e2e.test.ts ui/src/pages/chat/components/chat-composer-menu.test.tsx ui/src/pages/chat/components/chat-composer-slash-menu-state.ts 2>&1 | tee ../artifacts/format.log
          node scripts/run-oxlint.mjs --tsconfig ui/tsconfig.json ui/src/e2e/chat-thinking-arguments.e2e.test.ts ui/src/pages/chat/components/chat-composer-menu.test.tsx ui/src/pages/chat/components/chat-composer-slash-menu-state.ts 2>&1 | tee ../artifacts/lint.log
      - name: UI typecheck
        working-directory: source
        run: |
          set -euo pipefail
          node scripts/run-tsgo.mjs -p ui/tsconfig.json --noEmit 2>&1 | tee ../artifacts/typecheck.log
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD > ../artifacts/source-head.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: slash-argument-green
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
