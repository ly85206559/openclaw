name: Canonical Windows launcher formatting
on:
  push:
    branches: [codex/proof-windows-launcher-format-20261020]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e3068ea63c87ff1535c247fe7b610ae925448361
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - name: Return canonical formatter output without publishing changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e3068ea63c87ff1535c247fe7b610ae925448361
          mkdir -p "$RUNNER_TEMP/launcher-format"
          pnpm format src/daemon/schtasks-layout.ts src/daemon/service-command-read.test.ts
          pnpm format:check src/daemon/schtasks-layout.ts src/daemon/service-command-read.test.ts
          git diff --binary > "$RUNNER_TEMP/launcher-format/format.patch"
          cp src/daemon/schtasks-layout.ts src/daemon/service-command-read.test.ts "$RUNNER_TEMP/launcher-format/"
          git diff --name-only > "$RUNNER_TEMP/launcher-format/changed.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: launcher-format
          path: ${{ runner.temp }}/launcher-format
          if-no-files-found: error
          retention-days: 14
