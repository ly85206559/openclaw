name: Tlon code-fence boundary proof
on:
  push:
    branches: [codex/proof-tlon-code-fences-20261014]
  workflow_dispatch:
    inputs:
      candidate:
        description: "Full source SHA for GREEN; empty runs the frozen test-only RED source"
        required: false
        type: string
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASELINE: 93aa3cdf50b3da1215ae654ff95495871e4b308a
      CANDIDATE: ${{ inputs.candidate }}
      OPENCLAW_VITEST_MAX_WORKERS: 1
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Freeze fixtures and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tlon-proof"
          cp extensions/tlon/src/monitor/code-fences.proof.test.ts "$RUNNER_TEMP/tlon-proof/consumer.test.ts"
          cp extensions/tlon/src/monitor/utils.test.ts "$RUNNER_TEMP/tlon-proof/unit.test.ts"
          SOURCE="${CANDIDATE:-$BASELINE}"
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 https://github.com/ly85206559/openclaw.git "$SOURCE"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE"
          cp "$RUNNER_TEMP/tlon-proof/consumer.test.ts" extensions/tlon/src/monitor/code-fences.proof.test.ts
          cp "$RUNNER_TEMP/tlon-proof/unit.test.ts" extensions/tlon/src/monitor/utils.test.ts
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/tlon-proof/identity.txt"
          git hash-object extensions/tlon/src/monitor/utils.ts >> "$RUNNER_TEMP/tlon-proof/identity.txt"
          node --version >> "$RUNNER_TEMP/tlon-proof/identity.txt"
          corepack enable
          PACKAGE_PIN="$(node -p "require('./package.json').packageManager")"
          [[ "$PACKAGE_PIN" == pnpm@12.9.0+sha512.* ]]
          printf '%s\n' "$PACKAGE_PIN" >> "$RUNNER_TEMP/tlon-proof/identity.txt"
          pnpm --version >> "$RUNNER_TEMP/tlon-proof/identity.txt"
          pnpm install --frozen-lockfile
      - name: Execute independent parser and actual inbound consumer
        shell: bash
        run: |
          set -uo pipefail
          export OPENCLAW_VITEST_FS_MODULE_CACHE_PATH="$RUNNER_TEMP/tlon-proof/vitest-cache"
          START=$SECONDS
          node scripts/run-vitest.mjs extensions/tlon/src/monitor/utils.test.ts extensions/tlon/src/monitor/code-fences.proof.test.ts --reporter=json --outputFile="$RUNNER_TEMP/tlon-proof/results.json" 2>&1 | tee "$RUNNER_TEMP/tlon-proof/runtime.log"
          EXIT=${PIPESTATUS[0]}
          printf 'exit=%s\nwall_seconds=%s\n' "$EXIT" "$((SECONDS-START))" > "$RUNNER_TEMP/tlon-proof/exit.txt"
          export PROOF_RESULTS="$RUNNER_TEMP/tlon-proof/results.json" PROOF_EXIT="$EXIT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report = JSON.parse(fs.readFileSync(process.env.PROOF_RESULTS, 'utf8'));
          const tests = report.testResults.flatMap(suite => suite.assertionResults ?? []);
          const failed = tests.filter(test => test.status === 'failed');
          assert.equal(tests.length, 17, 'Both complete test files must collect');
          assert.equal(report.testResults.length, 2);
          assert.equal(report.numRuntimeErrorTestSuites ?? 0, 0);
          assert.equal(tests.filter(test => !['passed', 'failed'].includes(test.status)).length, 0);
          for (const suite of report.testResults) assert.equal(suite.message ?? '', '');
          if (process.env.CANDIDATE) {
            assert.equal(process.env.PROOF_EXIT, '0');
            assert.equal(failed.length, 0);
          } else {
            assert.equal(process.env.PROOF_EXIT, '1');
            assert.equal(failed.length, 4);
            assert.deepEqual(failed.map(test => test.title).sort(), [
              'preserves nested triple-backtick fences as one Markdown code block',
              'preserves longer backtick fences as one Markdown code block',
              'captures DM nested code at the inbound owner boundary',
              'captures group nested code at the inbound owner boundary',
            ].sort());
            assert(failed.every(test => /AssertionError/.test(test.failureMessages.join('\n'))));
          }
          assert.equal(tests.filter(test => test.status === 'pending').length, 0);
          console.log(JSON.stringify({ collected: tests.length, failed: failed.map(test => test.fullName), sourceMode: process.env.CANDIDATE ? 'candidate' : 'test-only baseline' }));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: tlon-code-fence-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tlon-proof/identity.txt
            ${{ runner.temp }}/tlon-proof/exit.txt
            ${{ runner.temp }}/tlon-proof/runtime.log
            ${{ runner.temp }}/tlon-proof/results.json
            ${{ runner.temp }}/tlon-proof/consumer.test.ts
            ${{ runner.temp }}/tlon-proof/unit.test.ts
          retention-days: 30
