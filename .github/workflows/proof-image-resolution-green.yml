name: Secretless image resolution candidate proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 03512be2f3df16d4ec861ed1bebeaa967c30da2d
      PRODUCT_SHA: 0ebfd52625fcec6661e76482ce72d8ada6a86885
      TEST_FILE: src/cli/capability-cli.test.ts
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze reviewed exact candidate and same baseline fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/image-resolution"
          cp .github/proof/image-resolution-audit-reporter.mjs "${RUNNER_TEMP}/image-resolution/audit-reporter.mjs"
          cp .github/proof/image-resolution-cli.mjs "${RUNNER_TEMP}/image-resolution/cli.mjs"
          git fetch --depth=3 --no-tags https://github.com/ly85206559/openclaw.git "${PRODUCT_SHA}"
          git checkout --detach "${PRODUCT_SHA}"
          test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
          git rev-parse HEAD HEAD^{tree} | tee "${RUNNER_TEMP}/image-resolution/candidate-source.txt"
          git diff --name-only "${BASE_SHA}" HEAD | tee "${RUNNER_TEMP}/image-resolution/product-paths.txt"
          diff -u <(printf '%s\n' src/cli/capability-cli.test.ts src/cli/capability-cli/image.ts) "${RUNNER_TEMP}/image-resolution/product-paths.txt"
          printf '%s  %s\n' 820c909ed139b5a559c9f24e134ef092bcbf9f293c0d6af973883cac4d397ec9 "${TEST_FILE}" | sha256sum --check
          sha256sum src/cli/capability-cli/image.ts "${TEST_FILE}" | tee "${RUNNER_TEMP}/image-resolution/executed-sha256.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          semantic-checks: true
          cache-mode: off
      - name: Original-order command suite must be GREEN
        shell: bash
        env:
          PROOF_AUDIT_PATH: ${{ runner.temp }}/image-resolution/runner-audit.json
        run: |
          set -euo pipefail
          { node --version; pnpm --version; } | tee "${RUNNER_TEMP}/image-resolution/toolchain.txt"
          /usr/bin/time -f '%e' -o "${RUNNER_TEMP}/image-resolution/green-wall.txt" \
            node scripts/run-vitest.mjs "${TEST_FILE}" --maxWorkers=1 --reporter=verbose --reporter=json \
            --reporter="${RUNNER_TEMP}/image-resolution/audit-reporter.mjs" --outputFile="${RUNNER_TEMP}/image-resolution/green.json" \
            > "${RUNNER_TEMP}/image-resolution/green.log" 2>&1
          cat "${RUNNER_TEMP}/image-resolution/green.log"
          node --input-type=module <<'AUDIT'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/image-resolution/green.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync(process.env.PROOF_AUDIT_PATH, 'utf8'));
          assert.equal(report.success, true);
          assert.equal(report.numTotalTests, 91);
          assert.equal(report.numPassedTests, 91);
          assert.equal(report.numFailedTests, 0);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.numTodoTests, 0);
          assert.equal(report.testResults.length, 1);
          assert.ok(report.testResults[0].name.endsWith(process.env.TEST_FILE));
          assert.equal(report.testResults[0].message, '');
          assert.equal(audit.reason, 'passed');
          assert.equal(audit.moduleCount, 1);
          assert.equal(audit.unhandledErrors, 0);
          assert.equal(audit.suiteErrors, 0);
          for (const test of report.testResults[0].assertionResults) assert.equal(test.status, 'passed');
          console.log('CANDIDATE_GREEN', JSON.stringify({ tests:91, fixtureErrors:0 }));
          AUDIT
      - name: Canonical build for actual supported CLI
        run: pnpm build > "${RUNNER_TEMP}/image-resolution/build.log" 2>&1
      - name: Actual supported CLI validates resolution before provider/model
        env:
          PROOF_MODE: candidate
        run: node "${RUNNER_TEMP}/image-resolution/cli.mjs" > "${RUNNER_TEMP}/image-resolution/cli.log" 2>&1
      - name: Retain raw receipts even on check or fixture failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-resolution-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/image-resolution
          retention-days: 30
