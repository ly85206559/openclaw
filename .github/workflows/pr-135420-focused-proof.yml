name: PR 135420 Bun identity and remaining gates

on:
  workflow_dispatch:
  push:
    branches: [codex/proof-135420-ready-20261019]

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c8b97b90894c684196b8aa6ed8f8985440ed06d
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the canonical checksum-pinned Bun test runtime
        uses: openclaw/openclaw/.github/actions/setup-test-bun@8102bc63bdc108f83c071e17f9de2d912507b14e
      - name: Install exact-source frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Prepare the exact candidate runtime once through its canonical owner
        run: |
          set -euo pipefail
          mkdir -p proof-results
          test "$(git rev-parse HEAD)" = 7c8b97b90894c684196b8aa6ed8f8985440ed06d
          node --import ./scripts/tsx.mjs --input-type=module -e 'import { runE2eGlobalSetup } from "./scripts/lib/vitest-build-prerequisites.mts"; await runE2eGlobalSetup();' > proof-results/runtime-prepare.log 2>&1
          cat proof-results/runtime-prepare.log
          git diff --exit-code
      - name: Prove actual Bun worker identity and both complete focused files
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync, realpathSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import path from 'node:path';
          const candidate = '7c8b97b90894c684196b8aa6ed8f8985440ed06d';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const git = (...args) => {
            const result = spawnSync('git', args, { encoding: 'utf8' });
            assert.equal(result.status, 0, result.stderr);
            return result.stdout.trim();
          };
          assert.equal(git('rev-parse', 'HEAD'), candidate);
          const executable = spawnSync('which', ['bun'], { encoding: 'utf8' });
          assert.equal(executable.status, 0);
          const bun = realpathSync(executable.stdout.trim());
          const revision = spawnSync(bun, ['--revision'], { encoding: 'utf8' });
          assert.equal(revision.status, 0);
          assert.equal(revision.stdout.trim(), '1.4.4-canary.1+7bd4fdff3');
          const executableHash = hash(readFileSync(bun));
          assert.equal(executableHash, '0f46c6ce133341ba52d2f7b3321488c53b62dd78bb30162367abc3f0373ce8ec');
          const receipt = {
            candidate, sourceTree: git('rev-parse', 'HEAD^{tree}'),
            bun, revision: revision.stdout.trim(), executableHash,
            nodeRedGreenRun: '39219584685',
            limitation: 'That prior run failed its lint configuration; its cells named bun were duplicate Node runs. This run supplies actual Bun, not repeated Node red/green.',
            sources: Object.fromEntries(['src/plugins/runtime-degraded-state.ts', 'src/plugins/runtime-degraded-state.test.ts', 'test/public-plugin-diagnostic-redaction.e2e.test.ts'].map((file) => [file, hash(readFileSync(file))])),
            cells: [],
          };
          writeFileSync('proof-results/require-bun-worker.ts', `import { beforeAll } from 'vitest';
          import { realpathSync } from 'node:fs';
          beforeAll(() => {
            if (!process.versions.bun || realpathSync(process.execPath) !== process.env.OPENCLAW_PROOF_BUN_EXECUTABLE) throw new Error('Expected the checksum-pinned Bun worker, not a Node fallback');
            process.stderr.write('bun-worker-proof:' + JSON.stringify({bun: process.versions.bun, executable: realpathSync(process.execPath)}) + '\\n');
          });`);
          // The old head lacks the runtime selector. Match the current canonical
          // vitest-test-runtime.mts contract explicitly; preserve each original config.
          for (const [name, config, file, expected] of [
            ['owner', 'plugins', 'src/plugins/runtime-degraded-state.test.ts', 4],
            ['gateway-cli', 'e2e', 'test/public-plugin-diagnostic-redaction.e2e.test.ts', 3],
          ]) {
            const wrapper = 'proof-results/bun-' + name + '.config.ts';
            writeFileSync(wrapper, `import base from '../test/vitest/vitest.${config}.config.ts';
            import path from 'node:path';
            export default {...base, test: {...base.test, setupFiles: [...(base.test?.setupFiles ?? []), path.resolve('proof-results/require-bun-worker.ts')]}};`);
            const args = ['--tsconfig-override', path.resolve('tsconfig.json'), 'node_modules/vitest/vitest.mjs', 'run', '--config', wrapper, file, '--maxWorkers=1', '--reporter=verbose', '--passWithNoTests=false'];
            const start = performance.now();
            const result = spawnSync(bun, args, {
              env: {...process.env, NODE_DISABLE_COMPILE_CACHE: '1', OPENCLAW_E2E_USE_PREBUILT_DIST: '1', OPENCLAW_PROOF_BUN_EXECUTABLE: bun},
              encoding: 'utf8', timeout: 15 * 60 * 1000, maxBuffer: 16 * 1024 * 1024,
            });
            const output = (result.stdout ?? '') + '\n' + (result.stderr ?? '');
            writeFileSync('proof-results/bun-' + name + '.log', output);
            process.stdout.write(output);
            const cell = {name, command: bun, args, exit: result.status, signal: result.signal, wallMs: Math.round(performance.now() - start), outputHash: hash(output)};
            receipt.cells.push(cell);
            writeFileSync('proof-results/receipt.json', JSON.stringify(receipt, null, 2));
            assert.equal(result.error, undefined);
            assert.equal(result.signal, null);
            assert.equal(result.status, 0);
            assert.match(output, /bun-worker-proof:/);
            assert.match(output, new RegExp('Tests\\s+' + expected + ' passed'));
            if (name === 'gateway-cli') assert.match(output, /public plugin diagnostic CLI proof: detailLength=1000 containsSyntheticCredential=false reason=missing-main-entry boundedTo1000=true/);
          }
          assert.equal(git('diff', '--name-only'), '');
          for (const [file, expected] of Object.entries(receipt.sources)) assert.equal(hash(readFileSync(file)), expected);
          receipt.sourceUnchanged = true;
          writeFileSync('proof-results/receipt.json', JSON.stringify(receipt, null, 2));
          NODE
      - name: Check the touched surface with its actual root-test config
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check test/public-plugin-diagnostic-redaction.e2e.test.ts
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.json test/public-plugin-diagnostic-redaction.e2e.test.ts
          git diff --check
      - name: Check the exact proof workflow through its canonical owner
        env:
          CARRIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CARRIER_SHA"
          workflow=.github/workflows/pr-135420-focused-proof.yml
          trap 'git show "HEAD:$workflow" > "$workflow"' EXIT
          git show "$CARRIER_SHA:$workflow" > "$workflow"
          pnpm check:workflows
          git diff --check
      - name: Preserve exact runtime identity, raw logs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-diagnostic-bun-${{ github.run_id }}
          path: proof-results/
          retention-days: 30
