name: PR 135420 readiness and diagnostic proof

on:
  workflow_dispatch:
  push:
    branches: [codex/proof-135420-ready-20261019]

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c8b97b90894c684196b8aa6ed8f8985440ed06d
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Set up the canonical checksum-pinned Bun test runtime
        uses: openclaw/openclaw/.github/actions/setup-test-bun@8102bc63bdc108f83c071e17f9de2d912507b14e
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove the original failure and the exact candidate through the Gateway CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-results
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const candidate = '7c8b97b90894c684196b8aa6ed8f8985440ed06d';
          const original = '60ca3b4cd5b4893d4a61e7bd770ad15e3ea99a03';
          const test = 'test/public-plugin-diagnostic-redaction.e2e.test.ts';
          const owner = 'src/plugins/runtime-degraded-state.ts';
          const hash = (value) => createHash('sha256').update(value).digest('hex');
          function git(...args) {
            const result = spawnSync('git', args, { encoding: 'utf8' });
            assert.equal(result.status, 0, result.stderr);
            return result.stdout.trim();
          }
          assert.equal(git('rev-parse', 'HEAD'), candidate);
          const sourceTest = readFileSync(test, 'utf8');
          const sourceOwner = readFileSync(owner, 'utf8');
          const receipt = {
            candidate, original, sourceTree: git('rev-parse', 'HEAD^{tree}'),
            node: process.version,
            bun: spawnSync('bun', ['--revision'], { encoding: 'utf8' }).stdout.trim(),
            testHash: hash(sourceTest), ownerHash: hash(sourceOwner), cells: [],
          };
          function runCell(name, file, runtime, filter) {
            const args = ['scripts/run-vitest.mjs', 'run', file, '--maxWorkers=1', '--reporter', 'verbose'];
            if (filter) args.push('-t', filter);
            const start = performance.now();
            const result = spawnSync(process.execPath, args, {
              env: { ...process.env, OPENCLAW_VITEST_RUNTIME: runtime },
              encoding: 'utf8', timeout: 15 * 60 * 1000, maxBuffer: 16 * 1024 * 1024,
            });
            const output = `${result.stdout ?? ''}\n${result.stderr ?? ''}`;
            writeFileSync(`proof-results/${name}.log`, output);
            process.stdout.write(output);
            assert.equal(result.error, undefined);
            assert.equal(result.signal, null);
            const cell = { name, runtime, exit: result.status, wallMs: Math.round(performance.now() - start), outputHash: hash(output) };
            receipt.cells.push(cell);
            console.log(JSON.stringify(cell));
            return { ...cell, output };
          }
          try {
            const oldTest = git('show', `${original}:${test}`);
            const start = 'async function waitForGatewayReady(';
            const end = '\nfunction findPluginDiagnostic(';
            const oldWait = oldTest.slice(oldTest.indexOf(start), oldTest.indexOf(end));
            assert.ok(oldWait.includes('while (Date.now() <= deadline)'));
            writeFileSync(test, sourceTest.slice(0, sourceTest.indexOf(start)) + oldWait + sourceTest.slice(sourceTest.indexOf(end)));
            const readinessRed = runCell('readiness-original-red', test, 'node', 'checks observed readiness before an expired deadline');
            assert.equal(readinessRed.exit, 1);
            assert.match(readinessRed.output, /timed out waiting for gateway ready/);
            assert.match(readinessRed.output, /1 failed.*1 passed/);
            writeFileSync(test, sourceTest);

            const expression = 'truncateUtf16Safe(redactToolPayloadText(privatePathRedactedDetail), 1_000)';
            assert.ok(sourceOwner.includes(expression));
            writeFileSync(owner, sourceOwner.replace(expression, 'privatePathRedactedDetail'));
            const unitRed = runCell('public-projection-original-red', 'src/plugins/runtime-degraded-state.test.ts', 'node');
            assert.equal(unitRed.exit, 1);
            assert.match(unitRed.output, /2 failed.*2 passed/);
            const cliRed = runCell('gateway-cli-original-red', test, 'node', 'redacts and bounds a synthetic');
            assert.equal(cliRed.exit, 1);
            assert.match(cliRed.output, /not to contain 'fixture-only-public-diagnostic-value'/);
            writeFileSync(owner, sourceOwner);
            assert.equal(git('diff', '--name-only'), '');

            // The baseline build is stamped with this HEAD; restoring clean source alone can reuse it.
            const rebuildStart = performance.now();
            const rebuild = spawnSync(process.execPath, ['scripts/run-node.mjs', '--version'], {
              env: { ...process.env, OPENCLAW_FORCE_BUILD: '1', OPENCLAW_BUILD_PRIVATE_QA: '1', OPENCLAW_RUN_NODE_SKIP_DTS_BUILD: '0' },
              encoding: 'utf8', timeout: 15 * 60 * 1000, maxBuffer: 16 * 1024 * 1024,
            });
            const rebuildOutput = `${rebuild.stdout ?? ''}\n${rebuild.stderr ?? ''}`;
            writeFileSync('proof-results/restored-candidate-build.log', rebuildOutput);
            process.stdout.write(rebuildOutput);
            receipt.runtimeRebuild = { exit: rebuild.status, wallMs: Math.round(performance.now() - rebuildStart), ownerHash: hash(readFileSync(owner)), outputHash: hash(rebuildOutput) };
            assert.equal(rebuild.error, undefined);
            assert.equal(rebuild.signal, null);
            assert.equal(rebuild.status, 0);

            for (const runtime of ['node', 'bun']) {
              const unit = runCell(`public-projection-${runtime}-green`, 'src/plugins/runtime-degraded-state.test.ts', runtime);
              assert.equal(unit.exit, 0);
              const cli = runCell(`gateway-cli-${runtime}-green`, test, runtime);
              assert.equal(cli.exit, 0);
              assert.match(cli.output, /3 passed/);
              assert.match(cli.output, /public plugin diagnostic CLI proof: detailLength=1000 containsSyntheticCredential=false reason=missing-main-entry boundedTo1000=true/);
            }
          } finally {
            writeFileSync(test, sourceTest);
            writeFileSync(owner, sourceOwner);
            receipt.restored = hash(readFileSync(test)) === receipt.testHash && hash(readFileSync(owner)) === receipt.ownerHash;
            writeFileSync('proof-results/receipt.json', JSON.stringify(receipt, null, 2));
            assert.ok(receipt.restored);
          }
          NODE
      - name: Check the touched surface
        run: |
          set -euo pipefail
          node_modules/.bin/oxfmt --check test/public-plugin-diagnostic-redaction.e2e.test.ts
          node scripts/run-oxlint.mjs --tsconfig test/tsconfig/tsconfig.test.root.e2e.json test/public-plugin-diagnostic-redaction.e2e.test.ts
          git diff --check
      - name: Check the exact proof workflow through its canonical owner
        env:
          CARRIER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CARRIER_SHA"
          workflow=.github/workflows/pr-135420-focused-proof.yml
          trap 'git show "HEAD:$workflow" > "$workflow"' EXIT
          git show "$CARRIER_SHA:$workflow" > "$workflow"
          pnpm check:workflows
          git diff --check
      - name: Preserve synthetic proof receipts
        if: always()
        uses: actions/upload-artifact@88c7c066e54f4de41105a2d281614a57c015317d3 # v7.0.0
        with:
          name: public-diagnostic-ready-${{ github.run_id }}
          path: proof-results/
          retention-days: 30
