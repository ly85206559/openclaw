name: PR 135420 focused diagnostic proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run public diagnostic CLI proof
        env:
          PUBLIC_DIAGNOSTIC_PROOF_LOG: public-diagnostic-proof.log
        run: >-
          node scripts/run-vitest.mjs run
          test/public-plugin-diagnostic-redaction.e2e.test.ts
          --reporter verbose
      - name: Show public diagnostic proof
        run: cat public-diagnostic-proof.log
