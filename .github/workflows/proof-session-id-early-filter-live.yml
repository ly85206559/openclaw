name: Proof session ID early filter live

on:
  push:
    branches:
      - proof/session-id-early-filter-live-20260913

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          fetch-depth: 2

      - name: Verify exact product-head lineage
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "fc31b4d6f34af79bc1e58e6a55a1ae47f7008817"
          test "$(git diff --name-only HEAD^ HEAD)" = $'.github/workflows/proof-session-id-early-filter-live.yml\nscripts/repro/session-id-early-filter-live-proof.mts'

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          install-deps: "true"

      - name: Build exact product head
        run: pnpm build

      - name: Run real Gateway sessions.resolve proof
        run: node --import tsx scripts/repro/session-id-early-filter-live-proof.mts

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: session-id-early-filter-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/session-id-early-filter-live
          if-no-files-found: warn
