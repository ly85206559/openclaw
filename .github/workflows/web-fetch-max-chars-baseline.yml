name: Web fetch max chars baseline

on:
  push:
    branches: [codex/web-fetch-max-chars-baseline-20261101]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 39629c6aa82ce444f14c37fc1d4d47e5c7f661d0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Fresh frozen install
        working-directory: source
        run: |
          mkdir -p ../artifacts
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/install.wall.txt pnpm install --frozen-lockfile 2>&1 | tee ../artifacts/install.log
      - name: Canonical runtime build
        working-directory: source
        run: |
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/build.wall.txt pnpm build:runtime 2>&1 | tee ../artifacts/build.log
      - name: Actual CLI feature absence and existing HTTP fetch
        run: |
          /usr/bin/time -f 'wall_seconds=%e' -o artifacts/baseline.wall.txt node controller/proof/web-fetch-max-chars-baseline.mjs source artifacts 2>&1 | tee artifacts/baseline.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: web-fetch-max-chars-baseline
          path: artifacts
          if-no-files-found: error
          retention-days: 14
