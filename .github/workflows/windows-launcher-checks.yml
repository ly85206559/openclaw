name: Windows launcher diagnostic focused checks
on:
  push:
    branches: [codex/proof-windows-launcher-20261020]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      OPENCLAW_TEST_RUNTIME: node
      OPENCLAW_FORMAT_TOOL: oxfmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0e01869e1eb780254ca6d142e650e573b7cfbda6
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - uses: ./.github/actions/setup-ripgrep
      - name: Original owner with unchanged candidate regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/launcher-checks"
          test "$(git rev-parse HEAD)" = 0e01869e1eb780254ca6d142e650e573b7cfbda6
          git hash-object src/daemon/service-command-read.test.ts > "$RUNNER_TEMP/launcher-checks/test-blob.txt"
          git checkout e12719836f8e1f8b835496928d95ad847e453333 -- src/daemon/schtasks-layout.ts src/daemon/service-inspection-error.ts
          git hash-object src/daemon/schtasks-layout.ts src/daemon/service-inspection-error.ts > "$RUNNER_TEMP/launcher-checks/baseline-inputs.txt"
          set +e
          pnpm test src/daemon/service-command-read.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/launcher-checks/baseline-tests.json" > "$RUNNER_TEMP/launcher-checks/baseline-tests.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/launcher-checks/baseline-tests.log"
          node --input-type=module - "$RUNNER_TEMP/launcher-checks/baseline-tests.json" "$result" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const [file, exit] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.notEqual(Number(exit), 0);
          assert.equal(r.numFailedTests, 5);
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.testResults.length, 1);
          const suite = r.testResults[0];
          assert.ok(suite.name.endsWith('/daemon/service-command-read.test.ts'));
          assert.equal(suite.status, 'failed');
          const failures = suite.assertionResults.filter(t => t.status === 'failed');
          assert.equal(failures.length, 5);
          assert.ok(suite.assertionResults.length > 6);
          assert.ok(suite.assertionResults.every(t => t.status === 'passed' || t.status === 'failed'));
          assert.ok(failures.every(t => t.fullName.includes('retains safe launcher failure details in service status:')));
          assert.ok(failures.every(t => t.failureMessages.join('\n').includes('Scheduled Task launcher line')));
          assert.equal(suite.assertionResults.length, r.numTotalTests);
          assert.equal(r.numPassedTests + r.numFailedTests, r.numTotalTests);
          JS
      - name: Candidate owner and affected consumers
        run: |
          set -euo pipefail
          git checkout 0e01869e1eb780254ca6d142e650e573b7cfbda6 -- src/daemon/schtasks-layout.ts src/daemon/service-inspection-error.ts
          test "$(git hash-object src/daemon/service-command-read.test.ts)" = "$(cat "$RUNNER_TEMP/launcher-checks/test-blob.txt")"
          git diff HEAD --exit-code
          git hash-object src/daemon/schtasks-layout.ts src/daemon/service-inspection-error.ts > "$RUNNER_TEMP/launcher-checks/fixed-inputs.txt"
          pnpm test src/daemon/service-command-read.test.ts src/daemon/schtasks.test.ts src/cli/update-cli/update-command-service-plan.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/launcher-checks/fixed-tests.json" 2>&1 | tee "$RUNNER_TEMP/launcher-checks/fixed-tests.log"
          node --input-type=module - "$RUNNER_TEMP/launcher-checks" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const dir = process.argv[2];
          const r = JSON.parse(fs.readFileSync(path.join(dir, 'fixed-tests.json'), 'utf8'));
          const base = JSON.parse(fs.readFileSync(path.join(dir, 'baseline-tests.json'), 'utf8'));
          assert.equal(r.success, true);
          assert.equal(r.numFailedTests, 0);
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.numPassedTests, r.numTotalTests);
          assert.equal(r.testResults.length, 3);
          for (const file of ['service-command-read.test.ts', 'schtasks.test.ts', 'update-command-service-plan.test.ts']) {
            const suites = r.testResults.filter(s => s.name.endsWith('/' + file));
            assert.equal(suites.length, 1);
            assert.equal(suites[0].status, 'passed');
            assert.ok(suites[0].assertionResults.length > 0);
            assert.ok(suites[0].assertionResults.every(t => t.status === 'passed'));
          }
          const owner = r.testResults.find(s => s.name.endsWith('/service-command-read.test.ts'));
          assert.deepEqual(owner.assertionResults.map(t => t.fullName), base.testResults[0].assertionResults.map(t => t.fullName));
          JS
      - name: Official changed-file checks
        run: |
          set -euo pipefail
          pnpm check:changed --base e12719836f8e1f8b835496928d95ad847e453333 2>&1 | tee "$RUNNER_TEMP/launcher-checks/checks.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-launcher-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/launcher-checks
          if-no-files-found: error
          retention-days: 30
