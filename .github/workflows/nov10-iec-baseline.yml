name: November 10 IEC size baseline

on:
  push:
    branches: [codex/discovery-proof-20261110]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_HEAD: 40c3b508ba130cb9244f077015321b4fa4e91965
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openclaw/openclaw
          ref: 40c3b508ba130cb9244f077015321b4fa4e91965
          fetch-depth: 1
          path: source
          persist-credentials: false
      # This exact patch meets package.json and node-version.mjs at SOURCE_HEAD.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Record source and runtime prerequisites
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          node --input-type=module <<'EOF' > ../artifacts/runtime-prerequisites.json
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { isSupportedOpenClawNodeVersion, formatNodeSecurityWarning } from './node-version.mjs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert(isSupportedOpenClawNodeVersion(process.versions.node));
          assert.equal(formatNodeSecurityWarning(process.versions.node), null);
          console.log(JSON.stringify({ node: process.versions.node, engines: pkg.engines, packageManager: pkg.packageManager, cli: pkg.scripts.openclaw }, null, 2));
          EOF
          pnpm --version > ../artifacts/pnpm-version.txt
      - name: Install frozen source dependencies
        working-directory: source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/install.wall.txt pnpm install --frozen-lockfile 2>&1 | tee ../artifacts/install.log
      - name: Actual CLI baseline and separate operational owner control
        working-directory: source
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/bin/time -f 'wall_seconds=%e' -o ../artifacts/runtime.wall.txt node --import ./scripts/tsx.mjs ../controller/proof/nov10-iec-baseline.mjs . ../artifacts "$SOURCE_HEAD" 2>&1 | tee ../artifacts/runtime.log
      - name: Record exact source and tracked cleanliness
        if: always()
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          git rev-parse HEAD > ../artifacts/source-head.txt
          git status --porcelain --untracked-files=no > ../artifacts/source-status.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test ! -s ../artifacts/source-status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nov10-iec-baseline-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
