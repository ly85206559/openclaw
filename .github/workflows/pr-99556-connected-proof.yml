name: PR 99556 connected Gateway proof

on:
  push:
    branches: [codex/proof-99556-connected-gateway-20260906]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify exact PR source and proof-only delta
        shell: bash
        run: |
          set -euo pipefail
          source_sha=42dafb18f822bcd6a48966badcf3f21f02289de9
          test "$(git merge-base HEAD "$source_sha")" = "$source_sha"
          test "$(git diff --name-only "$source_sha" HEAD | sort | tr '\n' ' ')" = ".github/workflows/pr-99556-connected-proof.yml ui/src/e2e/pr-99556-inline-media.real-gateway.e2e.test.ts "
          echo "Validated product source: $source_sha"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Run connected Gateway and Control UI proof
        env:
          OPENCLAW_CAPTURE_UI_PROOF: "1"
        run: node scripts/run-vitest.mjs run --config test/vitest/vitest.ui-e2e.config.ts --configLoader runner ui/src/e2e/pr-99556-inline-media.real-gateway.e2e.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-99556-connected-gateway-proof
          path: |
            .artifacts/control-ui-e2e/**
            .artifacts/control-ui-e2e-timeouts/**
          if-no-files-found: error
          retention-days: 90
