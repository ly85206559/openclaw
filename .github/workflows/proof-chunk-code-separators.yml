name: Unicode code preservation outbound proof

on:
  push:
    branches: [codex/proof-chunk-code-separators-20261003]
    paths: [".github/workflows/proof-chunk-code-separators.yml", ".github/proofs/chunk-code-separators/**", "src/infra/outbound/message-plan.test.ts", "src/infra/outbound/deliver.test.ts", "src/infra/outbound/chunk-code-separators.canonical.proof.test.ts"]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: red
            repository: openclaw/openclaw
            source: 32e30e59d9a7fd1f5b3a9e9659427d45145779dd
          - phase: green
            repository: ly85206559/openclaw
            source: 2725b3b8951af667b1367b1785efc2f721202790
    env:
      SOURCE_SHA: ${{ matrix.source }}
      PROOF_EXPECT: ${{ matrix.phase }}
      OPENCLAW_STATE_DIR: /tmp/chunk-code-separators-state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: proof-assets
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: source/package.json
      - name: Install locked dependencies without secrets
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Verify exact source and overlay only proof tests
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          if test "$PROOF_EXPECT" = red; then
            cp ../proof-assets/src/infra/outbound/message-plan.test.ts src/infra/outbound/message-plan.test.ts
          fi
          cp ../proof-assets/src/infra/outbound/deliver.test.ts src/infra/outbound/deliver.test.ts
          cp ../proof-assets/src/infra/outbound/chunk-code-separators.canonical.proof.test.ts src/infra/outbound/chunk-code-separators.canonical.proof.test.ts
          test -z "$(git diff --name-only -- src/auto-reply/chunk.ts src/infra/outbound/message-plan.ts src/infra/outbound/deliver-core.ts)"
      - name: Changed product formatting and lint
        if: matrix.phase == 'green'
        working-directory: source
        run: |
          if ! pnpm exec oxfmt --check src/auto-reply/chunk.ts src/auto-reply/chunk.test.ts src/infra/outbound/message-plan.test.ts; then
            pnpm exec oxfmt --write src/auto-reply/chunk.ts src/auto-reply/chunk.test.ts src/infra/outbound/message-plan.test.ts
            git diff -- src/auto-reply/chunk.ts src/auto-reply/chunk.test.ts src/infra/outbound/message-plan.test.ts
            exit 1
          fi
          node scripts/run-oxlint.mjs src/auto-reply/chunk.ts src/auto-reply/chunk.test.ts src/infra/outbound/message-plan.test.ts
          git diff --check
      - name: Canonical message, planner, raw substrate and prose controls
        working-directory: source
        run: node ../proof-assets/.github/proofs/chunk-code-separators/tests.mjs
      - name: Proportional core production and test types
        if: matrix.phase == 'green'
        working-directory: source
        run: |
          pnpm tsgo:core
          pnpm tsgo:test:src
