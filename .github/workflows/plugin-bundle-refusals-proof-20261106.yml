name: Plugin bundle refusal diagnostics proof
on:
  push:
    branches: [codex/proof-bundle-refusals-20261106]
permissions:
  contents: read
env:
  SOURCE_SHA: 5c03ac15f3487eed714d912efb52dfbf65c8cfa1
  PROOF_MODE: baseline
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw' && github.event.repository.fork == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
          sparse-checkout: .github/pr-proof
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ly85206559/openclaw
          ref: 5c03ac15f3487eed714d912efb52dfbf65c8cfa1
          fetch-depth: 3
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: ./source/.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: source/package.json
          lockfile-path: source/pnpm-lock.yaml
          node-version: 24.22.1
          cache-mode: off
      - name: Pin source and install locked dependencies
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          git rev-parse HEAD | tee ../artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          pnpm install --frozen-lockfile > ../artifacts/install.log 2>&1
          pnpm docs:list > ../artifacts/docs-list.log 2>&1
      - name: Build the frozen CLI
        working-directory: source
        run: pnpm build:runtime > ../artifacts/build.log 2>&1
      - name: Exercise actual CLI and negative controls
        run: node proof/.github/pr-proof/plugin-bundle-refusals-20261106.mjs source artifacts "$PROOF_MODE"
      - name: Verify source remains unchanged
        if: always()
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../artifacts
          git status --porcelain --untracked-files=no > ../artifacts/source-status-after.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test ! -s ../artifacts/source-status-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plugin-bundle-refusals-proof
          path: artifacts
          retention-days: 14
          if-no-files-found: error
