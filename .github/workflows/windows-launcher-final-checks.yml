name: Windows launcher final targeted gates
on:
  push:
    branches: [codex/proof-windows-launcher-final-checks-20261020]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      OPENCLAW_TEST_RUNTIME: node
      OPENCLAW_FORMAT_TOOL: oxfmt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b90de160f3153ca86e29d63894938b3645e0943
          persist-credentials: false
          fetch-depth: 4
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"
      - name: Exact final inputs and formatting
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/launcher-final"
          test "$(git rev-parse HEAD)" = 6b90de160f3153ca86e29d63894938b3645e0943
          git diff HEAD --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/launcher-final/head.txt"
          git hash-object src/daemon/schtasks-layout.ts src/daemon/schtasks-state-probe.ts src/daemon/service-command-read.test.ts src/daemon/service-inspection-error.ts > "$RUNNER_TEMP/launcher-final/blobs.txt"
          pnpm format:check docs/platforms/windows.md src/daemon/schtasks-layout.ts src/daemon/schtasks-state-probe.ts src/daemon/service-command-read.test.ts src/daemon/service-inspection-error.ts 2>&1 | tee "$RUNNER_TEMP/launcher-final/format.log"
      - name: Core producer and affected test-consumer types
        run: |
          set -euo pipefail
          pnpm tsgo:core 2>&1 | tee "$RUNNER_TEMP/launcher-final/core-types.log"
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.services.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/services.tsbuildinfo 2>&1 | tee "$RUNNER_TEMP/launcher-final/services-types.log"
          node scripts/run-tsgo.mjs -p test/tsconfig/tsconfig.core.test.cli-update.json --incremental --tsBuildInfoFile .artifacts/tsgo-cache/cli-update.tsbuildinfo 2>&1 | tee "$RUNNER_TEMP/launcher-final/update-types.log"
      - name: Touched-file lint
        run: |
          set -euo pipefail
          pnpm exec oxlint --type-aware --deny-warnings src/daemon/schtasks-layout.ts src/daemon/schtasks-state-probe.ts src/daemon/service-command-read.test.ts src/daemon/service-inspection-error.ts 2>&1 | tee "$RUNNER_TEMP/launcher-final/lint.log"
      - name: Final owner and affected consumer regressions
        run: |
          set -euo pipefail
          pnpm test src/daemon/service-command-read.test.ts src/daemon/schtasks.test.ts src/cli/update-cli/update-command-service-plan.test.ts --maxWorkers=1 --reporter=json --outputFile="$RUNNER_TEMP/launcher-final/tests.json" 2>&1 | tee "$RUNNER_TEMP/launcher-final/tests.log"
          node --input-type=module - "$RUNNER_TEMP/launcher-final/tests.json" <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const r = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          assert.equal(r.success, true);
          assert.equal(r.numTotalTests, 133);
          assert.equal(r.numPassedTests, 133);
          assert.equal(r.numFailedTests, 0);
          assert.equal(r.numPendingTests, 0);
          assert.equal(r.numTodoTests, 0);
          assert.equal(r.testResults.length, 3);
          for (const file of ['service-command-read.test.ts', 'schtasks.test.ts', 'update-command-service-plan.test.ts']) {
            const suites = r.testResults.filter(s => s.name.endsWith('/' + file));
            assert.equal(suites.length, 1);
            assert.equal(suites[0].status, 'passed');
            assert.ok(suites[0].assertionResults.length > 0);
            assert.ok(suites[0].assertionResults.every(t => t.status === 'passed'));
          }
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: launcher-final-targeted
          path: ${{ runner.temp }}/launcher-final
          if-no-files-found: error
          retention-days: 30
