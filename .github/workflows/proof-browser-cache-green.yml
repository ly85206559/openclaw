name: Exact-head small contract GREEN

on:
  push:
    branches: [codex/proof-browser-cache-contract-20261003]
    paths: [".github/workflows/proof-browser-cache-green.yml"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: browser
            source: aab42d5998a47ff02dfddba4919408d0c5449bd1
          - lane: media
            source: 42d957d7be1c3df53692d2a8512fec00c9c6083c
          - lane: nfc
            source: 87991a5a7c3fa2c16e5316ba7642ec4bca74e812
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ matrix.source }}
    steps:
      - name: Prepare isolated container tooling
        run: |
          apt-get update -qq
          apt-get install -y ca-certificates git ripgrep curl xz-utils libatomic1 python3 python3-venv
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 26a238427f47ea938f8b2022853ffd26ae643ac2
          path: proof-assets
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Install frozen dependencies without secrets
        run: pnpm install --frozen-lockfile
      - name: Verify candidate and run focused regression
        env:
          LANE: ${{ matrix.lane }}
        run: |
          git config --global --add safe.directory "$PWD"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p .proof
          cp proof-assets/.proof/browser-cache-* .proof/
          node .proof/browser-cache-check-unit.mjs GREEN "$LANE"
      - name: Run actual candidate flow
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [ "$LANE" = browser ]; then
            node extensions/browser/node_modules/playwright-core/cli.js install-deps chromium
            pnpm build
            node .proof/browser-cache-browser-runtime.mjs green "$SOURCE_SHA" .proof/browser-runtime-green.json
          else
            node .proof/browser-cache-check-runtime.mjs green "$LANE"
          fi
      - name: Proportional changed gates
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [ "$LANE" = browser ]; then
            paths=(extensions/browser/src/browser/chrome.executables.ts extensions/browser/src/browser/chrome.default-browser.test.ts docs/tools/browser/isolation.md)
          elif [ "$LANE" = media ]; then
            paths=(src/gateway/chat-display-projection.helpers.ts src/gateway/chat-display-projection.media.test.ts)
          else
            paths=(extensions/memory-core/src/memory/tokenize.ts extensions/memory-core/src/memory/mmr.test.ts)
          fi
          pnpm exec oxfmt --check "${paths[@]}"
          git diff --check
          node scripts/check-changed.mjs --base da9cb6dfaa748c125e49f736e51300d0ea57caab --dry-run -- "${paths[@]}"
          node scripts/check-changed.mjs --base da9cb6dfaa748c125e49f736e51300d0ea57caab -- "${paths[@]}"
      - name: Fetch proof workflows for static validation
        if: matrix.lane == 'media'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: proof-workflows
          persist-credentials: false
      - name: Validate proof workflow definitions
        if: matrix.lane == 'media'
        run: |
          cp proof-workflows/.github/workflows/proof-browser-cache-contract.yml .github/workflows/
          cp proof-workflows/.github/workflows/proof-browser-cache-green.yml .github/workflows/
          pnpm check:workflows
