name: Remote document charset boundary proof
on:
  push:
    branches: [codex/proof-media-transport-charset-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      CANDIDATE: 2f34ad4073aa77d1e28034b39b70162d7afbf311
      BASELINE: 5c26beee43a306682cdb0d7e182585dec8bbafde
      OPENCLAW_VITEST_MAX_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Pin candidate and prepare exact-source dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charset-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/charset-proof/carrier.txt"
          git fetch --no-tags --depth=1 https://github.com/ly85206559/openclaw.git "$CANDIDATE" "$BASELINE"
          git checkout --detach "$CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          cp src/media-understanding/file-context.test.ts "$RUNNER_TEMP/charset-proof/fixture.ts"
          sha256sum "$RUNNER_TEMP/charset-proof/fixture.ts" > "$RUNNER_TEMP/charset-proof/fixture.sha256"
          corepack enable
          { node --version; node -p "require('./package.json').packageManager"; pnpm --version; } > "$RUNNER_TEMP/charset-proof/toolchain.txt"
          pnpm install --frozen-lockfile
          node -p "require('vitest/package.json').version" >> "$RUNNER_TEMP/charset-proof/toolchain.txt"
          cat > "$RUNNER_TEMP/charset-proof/runtime-reporter.mjs" <<'REPORTER'
          import fs from 'node:fs';
          const error = ({name, message, stack, actual, expected}) => ({name, message, stack, actual, expected});
          export default class RuntimeReporter {
            onTestRunEnd(modules, unhandledErrors, reason) {
              const suiteErrors = modules.flatMap(module => [module, ...module.children.allSuites()].flatMap(suite => suite.errors().map(error)));
              const tests = modules.flatMap(module => [...module.children.allTests()].map(test => ({name:test.name, ...test.result(), errors:(test.result().errors ?? []).map(error)})));
              fs.writeFileSync(process.env.PROOF_EVENTS, JSON.stringify({reason, unhandledErrors:unhandledErrors.map(error), suiteErrors, tests}, null, 2));
            }
          }
          REPORTER
      - name: Paired real HTTP before and after with identical fixture
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_VITEST_FS_MODULE_CACHE_PATH="$RUNNER_TEMP/charset-proof/vitest-cache"
          for MODE in baseline candidate; do
            if [ "$MODE" = baseline ]; then REF="$BASELINE"; else REF="$CANDIDATE"; fi
            git checkout --detach "$REF"
            test "$(git rev-parse HEAD)" = "$REF"
            cp "$RUNNER_TEMP/charset-proof/fixture.ts" src/media-understanding/file-context.test.ts
            {
              git rev-parse HEAD HEAD^{tree}
              git hash-object packages/media-core/src/attachment-classify.ts src/media/fetch.ts src/media-understanding/attachments.cache.ts src/media-understanding/file-context.test.ts
              git status --short
            } > "$RUNNER_TEMP/charset-proof/$MODE-identity.txt"
            export PROOF_MODE="$MODE"
            export PROOF_RESULTS="$RUNNER_TEMP/charset-proof/$MODE-results.json"
            export PROOF_EVENTS="$RUNNER_TEMP/charset-proof/$MODE-events.json"
            set +e
            node scripts/run-vitest.mjs src/media-understanding/file-context.test.ts -t 'remote document charset' --maxWorkers=1 --reporter=verbose --reporter=json --reporter="$RUNNER_TEMP/charset-proof/runtime-reporter.mjs" --outputFile="$PROOF_RESULTS" > "$RUNNER_TEMP/charset-proof/$MODE-runtime.log" 2>&1
            EXIT=$?
            set -e
            printf 'exit=%s\n' "$EXIT" > "$RUNNER_TEMP/charset-proof/$MODE-exit.txt"
            cat "$RUNNER_TEMP/charset-proof/$MODE-runtime.log"
            export PROOF_EXIT="$EXIT"
            node --input-type=module <<'AUDIT'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(fs.readFileSync(process.env.PROOF_RESULTS, 'utf8'));
          const tests = result.testResults.flatMap(suite => suite.assertionResults ?? []).filter(test => test.ancestorTitles.includes('remote document charset'));
          assert.equal(tests.length, 8);
          assert(tests.every(test => ['passed', 'failed'].includes(test.status)));
          const events = JSON.parse(fs.readFileSync(process.env.PROOF_EVENTS, 'utf8'));
          assert.deepEqual(events.unhandledErrors, []);
          assert.deepEqual(events.suiteErrors, []);
          assert.equal(events.reason, process.env.PROOF_MODE === 'baseline' ? 'failed' : 'passed');
          assert(result.testResults.every(suite => !suite.message));
          const failed = tests.filter(test => test.status === 'failed');
          const names = failed.map(test => test.title).sort();
          const expected = process.env.PROOF_MODE === 'baseline' ? [
            'decodes transport charset through the real remote attachment owner',
            'decodes quoted transport alias through the real remote attachment owner',
            'decodes channel type without charset through the real remote attachment owner',
          ].sort() : [];
          assert.deepEqual(names, expected);
          const fixture = fs.readFileSync(process.env.RUNNER_TEMP + '/charset-proof/fixture.ts', 'utf8').split('\n');
          const line = fixture.findIndex(value => value.includes('expect(result.blocks[0]?.text).toContain')) + 1;
          assert(line > 0);
          for (const test of failed) {
            assert.equal(test.failureMessages.length, 1);
            const receipt = events.tests.find(entry => entry.name === test.title);
            assert.equal(receipt.state, 'failed');
            assert.equal(receipt.errors.length, 1);
            const error = receipt.errors[0];
            assert.equal(error.name, 'AssertionError');
            assert.equal(error.expected, '\n---\nПривет €\n');
            assert(error.actual.includes('Ïðèâåò ˆ'));
            assert(!error.actual.includes('Привет €'));
            assert(error.stack.includes('file-context.test.ts:' + line + ':'));
          }
          assert.equal(process.env.PROOF_EXIT, process.env.PROOF_MODE === 'baseline' ? '1' : '0');
          console.log(JSON.stringify({mode:process.env.PROOF_MODE,collected:tests.length,failed:names,passed:tests.length-failed.length}));
          AUDIT
          done
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test -z "$(git status --porcelain)"
      - name: Related owner and existing mock regression suites
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_VITEST_FS_MODULE_CACHE_PATH="$RUNNER_TEMP/charset-proof/vitest-cache"
          node scripts/run-vitest.mjs src/media-understanding/file-context.test.ts src/media-understanding/attachments.cache.test.ts src/media-understanding/media-understanding-url-fallback.test.ts src/media-understanding/apply.test.ts packages/media-core/src/attachment-classify.test.ts src/media/fetch.test.ts src/media/fetch.prototype-headers.test.ts src/media/input-files.extract.test.ts src/media/input-files.fetch-guard.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$RUNNER_TEMP/charset-proof/regressions.json" 2>&1 | tee "$RUNNER_TEMP/charset-proof/regressions.log"
      - name: Canonical changed-surface checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          FILES=(packages/media-core/src/attachment-classify.ts src/media/fetch.ts src/media-understanding/attachments.cache.ts src/media-understanding/file-context.test.ts src/media-understanding/attachments.cache.test.ts src/media-understanding/media-understanding-url-fallback.test.ts src/media-understanding/apply.test.ts)
          pnpm exec oxfmt --check "${FILES[@]}" 2>&1 | tee "$RUNNER_TEMP/charset-proof/format.log"
          node scripts/run-oxlint.mjs "${FILES[@]}" 2>&1 | tee "$RUNNER_TEMP/charset-proof/lint.log"
          node scripts/check-changed.mjs --dry-run -- "${FILES[@]}" > "$RUNNER_TEMP/charset-proof/changed-plan.log" 2>&1
          node scripts/run-tsgo.mjs -p tsconfig.core.json --incremental --tsBuildInfoFile "$RUNNER_TEMP/charset-proof/core.tsbuildinfo" 2>&1 | tee "$RUNNER_TEMP/charset-proof/types.log"
          git diff --check
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: remote-document-charset-${{ github.run_id }}
          path: ${{ runner.temp }}/charset-proof/
          retention-days: 30
