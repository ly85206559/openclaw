name: Remote document charset boundary proof
on:
  push:
    branches: [codex/proof-media-transport-charset-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    if: github.repository == 'ly85206559/openclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PROOF_MODE: baseline
      OPENCLAW_VITEST_MAX_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install exact source-pinned dependencies in secretless isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charset-proof"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/charset-proof/identity.txt"
          git hash-object packages/media-core/src/attachment-classify.ts src/media/fetch.ts src/media-understanding/attachments.cache.ts src/media-understanding/file-context.test.ts >> "$RUNNER_TEMP/charset-proof/identity.txt"
          corepack enable
          { node --version; node -p "require('./package.json').packageManager"; pnpm --version; } > "$RUNNER_TEMP/charset-proof/toolchain.txt"
          pnpm install --frozen-lockfile
      - name: Real HTTP cache classification extraction and model-visible file block
        shell: bash
        run: |
          set -euo pipefail
          export PROOF_RESULTS="$RUNNER_TEMP/charset-proof/results.json"
          export OPENCLAW_VITEST_FS_MODULE_CACHE_PATH="$RUNNER_TEMP/charset-proof/vitest-cache"
          START=$SECONDS
          set +e
          node scripts/run-vitest.mjs src/media-understanding/file-context.test.ts -t 'remote document charset' --maxWorkers=1 --reporter=verbose --reporter=json --outputFile="$PROOF_RESULTS" > "$RUNNER_TEMP/charset-proof/runtime.log" 2>&1
          EXIT=$?
          set -e
          printf 'exit=%s\nwall_seconds=%s\n' "$EXIT" "$((SECONDS-START))" > "$RUNNER_TEMP/charset-proof/exit.txt"
          cat "$RUNNER_TEMP/charset-proof/runtime.log"
          export PROOF_EXIT="$EXIT"
          node --input-type=module <<'AUDIT'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result = JSON.parse(fs.readFileSync(process.env.PROOF_RESULTS, 'utf8'));
          const tests = result.testResults.flatMap(suite => suite.assertionResults ?? []).filter(test => test.ancestorTitles.includes('remote document charset'));
          assert.equal(tests.length, 8);
          assert(tests.every(test => ['passed', 'failed'].includes(test.status)));
          assert.equal(result.numRuntimeErrorTestSuites ?? 0, 0);
          const failed = tests.filter(test => test.status === 'failed');
          const names = failed.map(test => test.title).sort();
          const expected = process.env.PROOF_MODE === 'baseline' ? [
            'decodes transport charset through the real remote attachment owner',
            'decodes quoted transport alias through the real remote attachment owner',
            'decodes channel type without charset through the real remote attachment owner',
          ].sort() : [];
          assert.deepEqual(names, expected);
          assert(failed.every(test => /AssertionError/.test(test.failureMessages.join('\n'))));
          assert.equal(process.env.PROOF_EXIT, process.env.PROOF_MODE === 'baseline' ? '1' : '0');
          console.log(JSON.stringify({mode:process.env.PROOF_MODE,collected:tests.length,failed:names,passed:tests.length-failed.length}));
          AUDIT
          exit "$EXIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: remote-document-charset-${{ github.run_id }}
          path: ${{ runner.temp }}/charset-proof/
          retention-days: 30
